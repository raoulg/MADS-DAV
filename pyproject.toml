[project]
name = "wa-analyzer"
version = "0.4.1"
description = "Code for the Master of Applied Data Science course Data Analysis and Visualization"
authors = [
    {name = "Raoul Grouls", email = "Raoul.Grouls@han.nl"},
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1.8",
    "datasets>=3.0.0",
    "goad-toolkit>=0.2.14",
    "huggingface-hub>=0.26.0",
    "loguru>=0.7.3",
    "networkx>=3.4.2",
    "numpy>=2.3",
    "pandas>=3.0",
    "plotly>=5.24.1",
    "pyarrow>=18.1.0",
    "pydantic>=2.10.4",
    "scikit-learn>=1.7",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.43.1",
]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
"analyzer" = "wa_analyzer.preprocess:main"

[project.urls]
GitHub = "https://github.com/raoulg/MADS-DAV"

[project.optional-dependencies]
huggingface = [
    "sentence-transformers>=3.3.1",
    "torch>=2.5.1",
    "transformers>=4.47.1",
    "vectormesh>=0.10.0",
]
plotting = [
    "plotly>=5.24.1",
    "streamlit>=1.41.1",
]


[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebooktester>=0.3.8",
    "ruff>=0.8.6",
    "ty>=0.0.71",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wa_analyzer", "scripts"]

[tool.mypy]
allow_redefinition = true
ignore_missing_imports = true
pretty = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C4", "PT", "S"]
