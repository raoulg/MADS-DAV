# mads_datasets -> HuggingFace, and the bridge to MADS-MachineLearning
#
# DAV is mandatory before the ML course. The ML course has dropped mads_datasets entirely
# for HuggingFace datasets + vectormesh VectorCaches. Whatever DAV teaches about "how data
# arrives" is the habit students bring with them.

meta:
  status: todo
  fixes: P4

current_state:
  mads_datasets_used_in:
    - notebooks/04.2-distribution_fitting.ipynb
    - notebooks/05.1-relationships.ipynb
    - notebooks/05.2-correlation.ipynb
    - pyproject.toml (both a core dependency and inside the `plotting` extra)
  what_it_provides_here: a few tabular datasets for showcase purposes, nothing more
  therefore: >
    Removing it is cheap. It is not load-bearing anywhere — it is three import lines and a
    dependency, and everything it supplies has a seaborn-bundled or hub equivalent.

target_state:
  data_arrives_three_ways:
    - id: bundled
      how: sns.load_dataset / vendored csv under data/showcase/
      when: showcase data for lessons 2-5
      why: reliability beats consistency for the data a lecture depends on
    - id: hub
      how: datasets.load_dataset("...")
      when: lesson 6, and anywhere text or vectors are involved
      why: this is the API the ML course assumes on day one
    - id: own
      how: the student's own export through the preprocessor + lesson 1 pipeline
      when: the "your turn" half of every lesson
  removed:
    - mads_datasets, from every notebook and from pyproject.toml

the_vectorcache_bridge:
  status: decided
  cache: pttrn-io/oxford-flowers-dinov2-small
  why_that_one:
    - It already exists and is already published — no new artefact to mint or maintain.
    - >
      It is labelled with 102 fine-grained classes, so cluster structure in a projection can
      be judged rather than admired.
    - >
      It is small enough that thirty students can each download it during a lecture, and it
      loads in one line with no model download.
    - >
      It carries the ML course's own lesson-1 hook — 1-NN by cosine similarity scoring 99.1%
      with nothing trained. Students meet that result here as a fact about vector spaces,
      and again in the ML course as a fact about baselines.
  idea: >
    Lesson 6.4 currently has every student download a sentence-transformer and embed their
    own messages before they can see anything. That is twenty minutes of waiting to reach
    the actual content. Invert it: load somebody's vectors, see what an organised vector
    space looks like, learn the metric that makes it readable — and only then take that
    apparatus to their own messy data, where the interesting problem is not the encoder but
    what counts as one row.
  why_this_matters_beyond_convenience: >
    "Embed once, reuse many times" is the organising principle of the entire ML course.
    Meeting it here — as a convenience rather than as a doctrine — means it is already
    familiar when it becomes the architecture.
  source_material:
    file: MADS-MachineLearning-course/notebooks/1_pytorch_intro/01_the_cache.ipynb
    reuse: >
      §1.1 (the 1-NN hook and its 4-line implementation) and the PCA scatterplot cell,
      largely as-is. Rewrite the surrounding framing for a visualisation course: there the
      point is "do not run the encoder twice", here it is "this is what structure looks
      like, and here is how you check that the picture is not lying".
  what_dav_adds_that_ml_does_not:
    - >
      Cosine similarity explained properly as a metric, contrasted with euclidean and
      manhattan — leerdoelen 6.6 and 6.11, which the ML course assumes rather than teaches.
    - >
      The projection as an object of suspicion: perplexity sweeps, PCA without scaling,
      variance-explained in the title. The ML course uses a projection to illustrate; DAV
      interrogates it.
  boundary: >
    DAV does NOT teach vectormesh components, training, or architecture. It teaches: vectors
    arrive from the hub, they have a shape, a metric makes them comparable, and projecting
    them into 2D loses information in specific ways. That is the whole overlap, and it
    should stay that narrow.
  the_shape_they_meet_from_both_sides: >
    ML lesson 5 chunks documents that are too long into (C, D) and aggregates back. DAV
    lesson 6.5 merges messages that are too short into (C, D) and aggregates back. Naming
    that symmetry costs one paragraph and buys the whole tensordtype-2 concept in advance.
    See 05-notebooks.yml#the_bridge_worth_naming.

what_dav_should_teach_about_the_hub:
  in_scope:
    - load_dataset and what a Dataset object is (columns, features, splits)
    - that a dataset has a card, a licence, and an author, and that these matter
    - .to_pandas() as the escape hatch back to what they already know
    - loading a set of precomputed vectors and asking what shape it is
  out_of_scope:
    - streaming, memory mapping, tokenisation, training
    - pushing to the hub (except as an aside in the dataset-card discussion)
  why_the_narrow_scope: >
    Every hour spent on hub mechanics is an hour not spent on visualisation, which is the
    course. The goal is recognition, not competence — competence is the ML course's job.

chat_data_as_the_natural_bridge:
  observation: >
    The own-chat dataset is, without any contrivance, the exact shape the ML course wants
    students to be comfortable with:
    - regex feature enrichment       -> hand-designed features vs learned ones
    - timestamps with daily cycles   -> sequential/temporal features
    - natural language               -> text encoders, embeddings
    - a pile of textbook distributions -> what a residual should look like
  therefore: >
    No new bridging material needs inventing. It needs naming: each lesson should say, in
    one sentence, what the ML course does with the thing just taught.
  action: Add a "where this goes next" line to the end of lessons 1, 4, 5 and 6.

