# The goad MCP server — coaching, not answering
#
# Modelled directly on vectormesh_mcp.py (github.com/raoulg/vectormesh) and codestyle_mcp.py.
# Same shape: a docs/ folder is the single source of truth, a single-file PEP-723 script
# serves it, and the centrepiece is a STAGED conversation the assistant cannot short-circuit.

meta:
  status: doing
  fixes: P3
  lives_in: goad_toolkit (goad_mcp.py + docs/ + MCP_SERVER.md)
  branch: feat/docs-and-mcp

the_problem_being_solved:
  observed: >
    A student with an assistant and an open assignment types "make me a visualisation of my
    whatsapp data" and gets twelve plots back. Every learning goal in the course is about the
    reasoning that produces one plot; none of it happened.
  not_the_solution:
    - Banning assistants. Unenforceable, and wrong — they will use them professionally.
    - A style guide in a README. Nothing reads it at the moment of temptation.
  the_solution: >
    Put the course's own method where the assistant will actually encounter it, as a tool it
    is instructed to call, that returns QUESTIONS rather than answers and refuses to advance
    until the student has answered them in their own words.

design_principles:
  - id: M1
    rule: One stage per call.
    why: >
      A tool that returns the whole method at once gets summarised into a plan and executed.
      A tool that returns stage 1 and says "ask them, wait, come back with what they said"
      forces a conversation. This is vectormesh's central trick and it works.
  - id: M2
    rule: The tool records the STUDENT's words, not the assistant's.
    why: >
      The `answers` parameter is explicitly documented as "must reflect their real answers,
      do not fabricate". It is not enforceable, but it is legible: a transcript where the
      assistant answered its own questions is obvious to a grader.
  - id: M3
    rule: Every stage returns a table — question / why it matters / what a good answer names.
    why: >
      "What a good answer names" is what makes it gradeable and stops the student answering
      "yes" to everything.
  - id: M4
    rule: docs/ is the only source of truth; the server just serves it.
    why: No build step, no embeddings, no drift between what is taught and what is served.
  - id: M5
    rule: Pin a tag per cohort.
    why: >
      GOAD_REF selects both the script (in the launch URL) and the docs it fetches, so a
      whole cohort runs identical material and the two cannot desynchronise.

server:
  name: goad
  file: goad_toolkit/goad_mcp.py
  runtime: uv run --no-project (PEP 723 inline deps — fastmcp only)
  env: GOAD_REF (git ref; a tag per cohort, `main` for Raoul's own use)
  docs_source: local docs/ when present, else raw.githubusercontent over HTTP

  tools:
    - name: goad_list_concepts
      does: List the chapters in reading order, optionally filtered.
      readonly: true
    - name: goad_get_concept
      does: Fetch one chapter's full markdown by number, filename, stem, or title.
      readonly: true
    - name: goad_search
      does: Term-frequency keyword search across all chapters, with snippets.
      readonly: true
    - name: goad_analysis_checklist
      does: THE CENTREPIECE. Six-stage analysis conversation, one stage per call.
      readonly: false
      stateful: in-memory, per server process (i.e. per session)
    - name: goad_critique_visual
      does: >
        Return the course's own visual-critique checklist (preattentive processing, gestalt
        principles, the five guidelines) as questions to put to the student about a plot
        they made. Mirrors checklist.md, which is what they are graded on.
      readonly: true
    - name: goad_distribution_method
      does: >
        The ordered method for going from a column of numbers to a defended distributional
        claim: look before fitting, discrete vs continuous, fit the registry, read KS against
        log-likelihood, check the qq-plot, and only then call something an outlier.
      readonly: true

  prompts:
    - name: analyse
      does: Start the six-stage analysis conversation. Optional `question` argument.
    - name: critique
      does: Walk a finished visualisation through the checklist.
    - name: distribution
      does: Coach the distribution-fitting method in order.

  resources:
    - uri: goad://concept/{name}
      does: Each chapter's raw markdown, addressable by number/filename/stem/title.

analysis_stages:
  note: >
    Six stages, in this order, because each one is unusable until the previous is answered.
    They deliberately mirror the course spine so a student recognises where they are.
  stages:
    - id: 1
      name: question
      asks: >
        What do you want to know, what would count as an answer, and who is the answer for?
      why_first: >
        Every remaining decision — which family of plot, which transform, which test — is
        downstream of this, and it is the stage students skip.
      course_link: the "goal oriented" half of Goal Oriented Analysis of Data
    - id: 2
      name: data
      asks: >
        What is one row? What was measured versus derived? What could you enrich it with
        (regex features, timestamp features, a join)?
      course_link: lesson 1 — cleaning, regex, pipelines
    - id: 3
      name: shape
      asks: >
        For each variable in play: discrete or continuous, what does its distribution look
        like, is it long-tailed, and are the extreme values errors or ordinary members of a
        heavy tail?
      course_link: lesson 4 — distributions, and the outliers learning goals
    - id: 4
      name: encoding
      asks: >
        Which of the five families does this question live in, and which visual channel
        carries the comparison you actually care about?
      course_link: the spine — categories / time / distributions / relations / high-dimensional
    - id: 5
      name: critique
      asks: >
        First 200ms — what does the plot say before anyone thinks? Which gestalt principles
        are doing work? Which of the five guidelines is it violating?
      course_link: checklist.md, the rubric
    - id: 6
      name: verification
      asks: >
        How would you know this pattern is real? Residuals, a confounder, a resample, a
        held-out slice, a null comparison.
      course_link: lesson 5 — the map is not the terrain
  gate: >
    A stage advances only when the tool is called again with the same stage plus `answers`
    of substance (a minimum length is enforced as a crude floor). Completion returns a recap
    of everything recorded, which is a usable first draft of the student's write-up.

course_wide_assistant_policy:
  status: proposed
  what: >
    Ship a .claude/ (and .cursor/) config in MADS-DAV that registers three MCP servers —
    goad, codestyle, and vectormesh — and a CLAUDE.md stating the course's expectation:
    the assistant coaches, the student decides, and any submitted analysis must be one the
    student can defend without the assistant present.
  why: >
    Same reasoning as the server itself: put the policy where the tool will read it. A rule
    in a syllabus PDF is not in the context window.
  see_also: >
    codestyle already has an MCP server for code review; that covers the "is my code any
    good" half. goad covers "is my analysis any good". Together they cover the rubric.

what_this_is_not:
  - It does not generate plots. If a student wants code, the assistant writes it — after the
    six stages, and the recap makes clear what it was written for.
  - It does not grade. It asks the questions a grader will ask, early enough to matter.
  - It does not persist across sessions. A design conversation is meant to happen in one
    sitting; a half-finished one from three days ago silently resuming would be worse.

