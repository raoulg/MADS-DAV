# Teaching students not to invent findings
#
# The single failure mode that fails students in this course. Written as its own file
# because it is not one lesson — it is a thread with three "aha" moments that have to
# arrive in order, and because getting it right matters more than any other change here.

meta:
  status: proposed
  supersedes: 08-learning-goals.yml#the_crowds_question (the lesson-5 slot it competes for)

the_observed_failure:
  examples_from_real_submissions:
    - claim: "Males tend to write shorter messages."
      data: a chat with 2 women and 3 men
      what_is_wrong: >
        The claim is about people. There are five people. The 4000 messages are not 4000
        independent observations of the claim — they are five, each measured many times.
    - claim: "People on the 4th floor have worse sentiment."
      data: a building chat, sentiment scored per message
      what_is_wrong: >
        Every set of numbers has a maximum. Attach a number to five floors and one of them
        is last. That is arithmetic, not a finding — and nothing here rules out the floor
        with three people who happened to have a bad week.
  the_shared_root: >
    In both cases the student computed something real, saw an order, and told a story about
    it. Nothing in the pipeline ever asked "what would this look like if there were nothing
    there?" — so a difference that noise produces reliably was read as a discovery.
  why_it_is_hard_to_teach: >
    Being told "correlation is not causation" changes nobody's behaviour, because every
    student already believes they know that and would never do it. The belief survives
    because they have never watched themselves do it. So the lesson cannot be a warning. It
    has to be a trap they walk into.

the_correction:
  status: proposed
  raised_by: Raoul, 2026-08-10
  what_was_wrong: >
    The thread below is entirely demolition. Taught as written it produces students who
    either never claim anything, or who recite "correlation is not causation" as a ritual
    and carry on. Two specific errors:
  errors:
    - id: E1
      wrong: >
        Treating a question that came from the data as automatically illegitimate.
      right: >
        Exploration is how most real questions are found, and this course is exploratory by
        construction — the student is handed their own chat and asked what they wonder about
        it. The failure is not noticing a pattern; it is letting the same data both suggest
        and confirm it. Fixed in the MCP: the stage-1 question now asks which KIND of
        question it is and what a data-suggested one will be checked against.
    - id: E2
      wrong: >
        Treating all spurious findings as one problem with one remedy.
      right: >
        They are two different failures. n=3 is mechanical — any test would have returned a
        null, so the error is that no check was run at all. The forking-paths case is the
        opposite: the test DOES come out significant, and no amount of scrutiny applied to
        the survivor recovers the comparisons that were not reported.
  the_missing_axis:
    what: prior plausibility — is there a mechanism?
    why_nothing_else_covers_it: >
      n, unit-of-analysis, timing and multiplicity are all statistical. None of them answers
      the 4th-floor case, where the difference might be perfectly significant and still mean
      nothing, because floors do not cause character. Where no mechanism exists, a striking
      result is more likely a confounder than a discovery — and the confounder is often
      worth chasing (the 4th floor is one department, which is Simpson's paradox again).
    added_to_mcp: >
      Stage 1 now asks "what mechanism would explain a yes, and would you have predicted
      it?" — asked before the data can supply an answer.
  the_constructive_half: >
    S4 and S5 in the thread below. Specified, not built — they are written out far enough
    that the notebooks can be produced without re-deciding anything, and both wait on the
    IRC slice before anyone runs a cell.

design_principle:
  rule: The student must make the error and be caught by the data, in that order.
  corollary: >
    The demonstration has to run on data where the truth is known to be "nothing", so that
    finding something is unambiguous evidence about the method rather than an argument
    about the domain.
  second_corollary: >
    It should catch the whole room at once. A trap that catches one student is humiliating;
    a trap that catches everyone is a shared discovery, and shame is what makes people stop
    listening.

# ---------------------------------------------------------------------------------------
# Three aha moments, in the order they have to arrive
# ---------------------------------------------------------------------------------------

thread:
  # Ids are not in lesson order — S4 and S5 were added later and renumbering would have
  # stranded the cross-references in 02-datasets.yml and 05-notebooks.yml. Teaching order is:
  #   lesson 2 : S1  (unit of analysis, ranking illusion)
  #   lesson 4 : S2  (what nothing looks like) -> S4 (what something looks like)
  #   lesson 5 : S3  (the forking-paths trap)  -> S5 (what would make you believe it)
  # The pairing matters in both later lessons: the second half of each pair is what stops
  # the first half from teaching that nothing is ever knowable.

  - id: S1
    lesson: 2
    title: n is the number of people, not the number of messages
    the_aha: The same data, two units of analysis, opposite conclusions.
    needs_no_machinery: true
    demo:
      steps:
        - Compute mean message length per group, over all messages. The difference is large
          and looks overwhelming — thousands of rows behind each bar.
        - >
          Aggregate to one number per author. Plot those points, five of them, coloured by
          group. The groups overlap completely.
        - Put the two plots side by side. Ask which one answers the claim.
      the_line_to_say: >
        "The bar chart has n=4000. Your claim has n=5. The messages are not independent
        observations of a person's style — they are one observation, measured 800 times."
      name_it: pseudoreplication
      why_naming_matters: >
        A named error is one a student can recognise in their own draft. "Be careful with
        small groups" is not actionable; "check whether your n is your claim's unit or your
        dataframe's unit" is.
    second_demo:
      title: The ranking illusion
      steps:
        - Rank the authors by any metric. There is a number one. There is always a number one.
        - >
          Add a bootstrap confidence interval to each author's value and sort by the point
          estimate — a caterpillar plot. The intervals overlap almost entirely.
        - >
          Bootstrap the ranking itself: across resamples, how often is the top author
          actually top? Usually far less often than students expect.
      the_line_to_say: >
        "You did not find that this author writes the longest messages. You found that
        somebody had to."
      why_lesson_2: >
        It is a categorical comparison plot, it needs no distribution theory, and lesson 2
        is where the student first computes a group difference — which is where the habit
        has to be installed, before they have five weeks of practice doing it wrong.
    goad_hooks:
      - a caterpillar plot (sorted point estimates + intervals) is a new BasePlot subclass
      - pairs with the Simpson's paradox demo moving into this lesson
    status: proposed

  - id: S2
    lesson: 4
    title: What "nothing" looks like
    the_aha: You can see the null. It is a distribution, and your finding is inside it.
    needs: lesson 4's distribution vocabulary; nothing else
    demo:
      steps:
        - Compute the observed difference between two groups. One number.
        - >
          Shuffle the group labels 1000 times, recomputing the difference each time. Nothing
          about the data changed except which label sits next to which author, so every one
          of those 1000 numbers is a difference produced by nothing at all.
        - Histogram them. Draw the observed value on it as a vertical line.
        - Read off where it sits.
      why_it_works: >
        It requires no test, no assumption, no table of critical values, and it produces a
        picture rather than a p-value — which is exactly this course's register. A student
        who has seen their own finding sitting comfortably in the middle of the null
        distribution does not need to be told what a p-value means.
      generalises_to: >
        Any statistic. Difference in means, difference in medians, a correlation, a rank
        ordering, the gap between the top and second author. Shuffle whatever the claim
        says is meaningful and recompute.
    leerdoel: 4.17 (the Monte Carlo goal lifted from goad_exercises)
    goad_hooks:
      - HistogramPlot + a vertical-line annotation layer; both nearly exist already
      - >
        A NullDistribution helper — take data, a statistic, and a label column; return the
        shuffled distribution and the observed value. Proposed as G16 in
        03-goad-integration.yml.
    status: proposed

  - id: S3
    lesson: 5
    title: The garden of forking paths
    the_aha: The whole room finds a significant result in data that has none.
    replaces: leerdoelen 5.7 and 5.8
    demo:
      setup: >
        Hand out the IRC corpus with an extra column: a "cohort" label assigned to each
        author. Do not say how it was assigned. It was np.random.permutation.
      instruction_to_students: >
        "Find the most interesting difference between cohort A and cohort B. Here are
        fifteen things you could measure." — message length, messages per day, hour of
        first message, question-mark rate, URL rate, emoji rate, response time, weekend
        share, vocabulary size, average word length, reply rate, session length, ...
      what_happens: >
        Everyone finds something. With fifteen independent tests at the conventional
        threshold, the probability that at least one comes up is about 54%. Across a room of
        thirty students each trying several, somebody will produce something that looks
        strong enough to build a slide on.
      the_reveal: The labels were random. There was never anything to find.
      then_quantify: >
        1 - 0.95^15 = 0.54. Put that number on the board. The question was never "is this
        result surprising" — it is "is the most surprising of fifteen results surprising",
        and those have completely different answers.
      then_make_it_constructive:
        - >
          Write the question down before looking. This is stage 1 of the analysis checklist,
          and it is the whole defence.
        - >
          Or split the data: hunt on one half, confirm on the other. A finding that does not
          survive the second half was never a finding.
        - >
          Or say plainly how many things you looked at. A result reported as "the best of
          fifteen" is honest and still publishable; the same result reported as "we found"
          is not.
    why_lesson_5: >
      It is the correlation lesson, and this is the correlation failure. It also lands
      immediately after Anscombe/Datasaurus, which teaches that a summary statistic can hide
      the picture — this teaches that a picture can hide the search that produced it.
    risk:
      what: The demo can read as nihilistic — "nothing is ever real".
      mitigation: >
        Follow it the same session with a finding that IS real and survives every check: the
        Ubuntu release-day spike in the IRC activity model. Deflation followed by a real
        result is a lesson; deflation alone is cynicism.
    status: proposed

  - id: S4
    lesson: 4
    title: What a real effect looks like as data accumulates
    the_aha: >
      A fake effect does not become real with more data — it converges on nothing. And at
      small n the two are indistinguishable, which is why n=3 was never going to work.
    position: immediately after S2, same notebook. S2 shows what nothing looks like; S4
      shows what something looks like, and what the difference costs in sample size.
    demo:
      setup:
        real_effect:
          claim: hour-of-day activity — messages per author in the evening versus the morning
          why_this_one: >
            The mechanism is beyond dispute (people sleep), so when the demo shows the
            interval settling away from zero, nobody argues about whether the effect is real.
            That is what makes it usable as the reference case.
        fake_effect:
          claim: the same computation with author labels randomly permuted
          why: known to be nothing, by construction
      steps:
        - >
          For n in [10, 30, 100, 300] authors — subsample, compute the effect, bootstrap a
          confidence interval. Repeat the whole draw several times per n, so the student sees
          the estimate jumping around at small n rather than one tidy point.
        - >
          Plot both series on the same axes — x is n, y is the effect estimate with its
          interval, real in colour and fake in grey.
      how_to_read_it:
        - >
          The real effect starts wide and wandering, then narrows around a non-zero value and
          stops containing zero somewhere along the way.
        - >
          The fake effect also starts wide and wandering — identical to the real one, by eye,
          at n=10 — and then narrows around zero and stays there.
        - >
          The two are indistinguishable at the left-hand end. That IS the n=3 lesson from
          lesson 2, arriving with a picture instead of an assertion.
    what_it_licenses:
      - >
        The phrase "more data" stops meaning "more rows" and starts meaning "more independent
        units", because the x axis is authors, not messages.
      - >
        It turns a null result into a statement with content — "with five authors, an effect
        would have to be enormous before I could see it" — which is the bottom-left cell of
        S5's grid and the thing students never write.
      - >
        It answers the objection this whole thread invites, that everything is unknowable.
        Some things are knowable. This is what it costs.
    goad_hooks:
      - reuses G16 NullDistribution for the bootstrap
      - a plot of estimate-with-interval against n; close cousin of G15 CaterpillarPlot
    verification_needed:
      status: blocked
      on: the IRC slice (02-datasets.yml#reference_chat actions R1, R2)
      check: >
        Confirm the two curves actually separate visibly at these sample sizes on the chosen
        channel. If the effect is so large that it separates at n=10, pick a subtler real
        effect — weekday versus weekend message length is the obvious second candidate.
      why_it_matters: >
        The whole demo is a claim about how a picture looks. A spec for it is worth less than
        the ten minutes of running it, so do not write the notebook before checking.
    status: proposed

  - id: S5
    lesson: 5
    title: What would make you believe it
    the_aha: >
      Statistics is one leg of three. A significant result with no mechanism is not a
      finding, and a null result with a good mechanism is not a failure.
    position: >
      Immediately after S3, same session. The forking-paths trap deflates; this rebuilds.
      Running S3 without S5 produces cynicism, which is a worse outcome than the credulity it
      was meant to cure.
    the_three_legs:
      - id: evidence
        question: Does the data support it?
        checks: n at the claim's unit, effect size, survives a null test
        covered_by: S1, S2, S4
      - id: mechanism
        question: Is there a reason it would be true — and would you have predicted it?
        checks: can you name the mechanism before seeing the result
        note: >
          This is the leg no amount of statistics supplies, and the one that answers the
          4th-floor case.
      - id: replication
        question: Does it show up somewhere you did not look?
        checks: another period, another group, a second measure of the same thing
        note: >
          Three mediocre independent confirmations beat one good p-value. This is the
          strongest single move a student can make and almost none of them make it.

    the_grid:
      description: >
        Mechanism against evidence, as a 2x2. The diagonal is trivial; the two off-diagonal
        cells are the entire lesson.
      cells:
        - position: mechanism yes, survives testing
          verdict: Report it.
          then: Check leg three before writing it down as settled.
        - position: mechanism yes, fails testing
          verdict: "Plausible, unproven — and say exactly that."
          then: >
            State what would settle it, in units of sample size, using S4. This is a
            legitimate and useful output that students essentially never produce, because
            they read a null as a failed assignment rather than as a result.
        - position: mechanism no, survives testing
          verdict: Do not conclude. Go looking.
          then: >
            A fluke, or a confounder you have not named. The confounder is usually more
            interesting than the original claim — and finding it is Simpson's paradox from
            lesson 2, arriving with a reason to care.
        - position: mechanism no, fails testing
          verdict: Nothing here. Drop it.
          then: Move on without writing a paragraph about it.

    worked_examples:
      description: >
        Run each of these through the grid in class, in this order. The point of the
        sequence is that the right response differs every time, so "always be sceptical" is
        visibly not the lesson.
      examples:
        - claim: Fewer messages get sent at 4am than at 9pm.
          mechanism: overwhelming — people sleep
          evidence: enormous effect, visible without any test
          cell: mechanism yes / survives — and still worthless
          teaches: >
            The grid has a fifth verdict the 2x2 does not show: TRUE AND NOT WORTH REPORTING.
            A claim can pass every check in this file and still tell the reader nothing they
            did not know before opening the page. Students reach for these constantly,
            because they are easy to support — and supporting them is the whole problem.
          the_follow_up_question: >
            "You have shown people sleep. What did you expect the cycle to look like, and
            where does it differ from that?" The obvious pattern is the model. What it fails
            to explain is the finding.
          pairs_with: the next row, which is the same data done properly

        - claim: >
            An Ubuntu release does not make people stay up — it moves the peak. #ubuntu-uk
            normally peaks at 10:00 UTC and #ubuntu-it at 17:00; on release days both peak at
            14:00.
          mechanism: >
            a global event imposing its own clock on channels that otherwise keep local time
          evidence: >
            Night-hour share actually FALLS on release days (0.91x on #ubuntu), so the
            obvious hypothesis is refuted. The finding only appears after the daily cycle is
            normalised away and the shapes compared.
          cell: mechanism yes / survives
          teaches: >
            The same dataset as the row above, with the boring part subtracted instead of
            reported. This is the pair that makes the point: not "be sceptical", but "you
            already had the answer to the wrong question — here is what to do with it".
          bonus: >
            A worked example of a prediction being REFUTED (nobody stays up) is worth more
            than three of predictions confirmed, and this one costs nothing to include.
          see: 11-beyond-the-obvious.yml#release_imposes_its_own_clock
        - claim: Messages are longer on weekdays than at weekends.
          mechanism: real but ambiguous — work talk is more formal, weekend talk is more
            relaxed and chattier. You cannot predict the sign.
          evidence: needs an actual test
          cell: mechanism yes / testing decides
          teaches: >
            This is where statistics genuinely earns its keep — a mechanism exists but does
            not tell you the direction. If every example in the course were case 1 or case 3,
            students would conclude tests are pointless.
        - claim: Authors whose nickname starts with A-M write longer messages.
          mechanism: none
          evidence: >
            Hunt across enough channels and years and you will find a slice where it is
            "significant". Do exactly that, in front of them.
          cell: mechanism no / survives
          teaches: >
            Then test it on a different year, where it evaporates. The absurdity of the claim
            is what makes the mechanism point land — nobody defends the alphabet, so nobody
            gets defensive.
        - claim: People on the 4th floor have worse sentiment.
          mechanism: none for "floor causes mood" — but a strong one for "floor is roughly
            department, and departments differ in workload"
          cell: mechanism no / survives, leading to a confounder hunt
          teaches: >
            The most important example in the set. No mechanism does not mean no finding — it
            means you have not found it yet. The confounder is the result, and it is a better
            result than the one that was almost reported.
        - claim: Alice is the most active author in this chat.
          mechanism: not applicable — a ranking claim, not a causal one
          evidence: entirely a question of ranking stability
          cell: sideways to the grid
          teaches: >
            A ranking claim needs a different check from a difference claim. Back to S1's
            caterpillar plot.
        - claim: This channel's activity declined after 2016.
          mechanism: strong and predictable in advance — Discord, Slack and Matrix
          evidence: clear trend over a long series
          replication: holds independently across every Ubuntu channel
          cell: all three legs
          teaches: what a fully supported claim looks like — the reference standard
        - claim: Ubuntu release days produce a traffic spike.
          mechanism: strong, and the dates are known in advance rather than found in the data
          evidence: visible in the residual of the lesson-5 model, invisible in the raw series
          replication: every six months for twenty years — roughly 40 independent instances
          cell: the gold standard
          teaches: >
            The deflation antidote. A real, checkable, mechanistically sensible finding,
            landing in the same session as the forking-paths trap. Deflation followed by a
            genuine result is a lesson; deflation alone is cynicism.

    replication_concretely:
      on_the_irc_corpus: >
        Find it in 2015 in one channel, then check 2016, then check a different channel.
        Twenty years and many channels make this nearly free, which is unusual and worth
        exploiting.
      on_their_own_chat:
        - first half of the history against the second half
        - one group chat against another
        - >
          a second measure of the same construct — if the claim is "Alice is chattier", check
          message count, message length AND conversation-initiation rate. Three measures
          agreeing is a far stronger argument than one test clearing a threshold, and it
          needs no statistics at all.

    assessment_consequence:
      status: proposed
      what: >
        The rubric should reward the grid. A student reporting "plausible, unproven, here is
        the sample size that would settle it" should score ABOVE one reporting a significant
        result with no mechanism named.
      why: >
        Otherwise the incentive still points at producing findings, and everything in this
        thread is advice the assessment contradicts.
      see: 08-learning-goals.yml

    status: proposed

# ---------------------------------------------------------------------------------------
# What lesson 5 becomes, since 5.7/5.8 are not carrying it
# ---------------------------------------------------------------------------------------

lesson_5_replacement:
  context: >
    Raoul's question about 5.7/5.8 was "how realistic is it that they will use this". For
    Condorcet and the diversity prediction theorem in a visualisation course: low. For "do
    not report the largest of fifteen differences": every single project, every cohort.
  proposed_shape:
    - Anscombe + Datasaurus — a summary statistic can hide the picture.
    - Scatter, hue/size, lowess versus linear — the relations toolkit (leerdoelen 5.9-5.16).
    - S3, the forking-paths trap.
    - >
      Build a model of IRC channel activity from scratch — trend plus weekly seasonality —
      the way demo/linear.py builds one for covid. Look at the residual. The release-day
      spikes are in it.
    - Correlation matrix and regularisation as feature selection (5.5, 5.6, 5.9, 5.17, 5.18).
  why_the_irc_model_belongs_here:
    - >
      It is the same dataset the student decomposed in lesson 3 and fitted distributions to
      in lesson 4 — so the showcase corpus gets carried across lessons exactly the way their
      own chat is, which is the point of having a reference corpus at all.
    - >
      The residual contains a real, checkable finding with a known date, arriving right
      after a demonstration that most findings are not real.
    - >
      It answers "why would I write a model in a visualisation course" concretely: because
      the release spike is invisible in the raw series and obvious in the residual.
  covid_is_not_homeless: >
    demo/linear.py stays as the worked example the student READS — it is also the
    notebook-to-script lesson (07-goad-exercises-reuse.yml#E4). IRC is what they DO. Same
    method, second dataset, and the second time is where it sticks.

the_5758_decision:
  status: deferred, per Raoul
  but_note: >
    The lesson-5 slot they occupy is now spoken for by S3 and the IRC model. Keeping them
    means finding room elsewhere, not just leaving the leerdoelen file alone.
  recommendation: drop
  reasoning: >
    The honest version of the original intent — "combine simple models, it works better" —
    needs a classification problem, several model families, and a metric, none of which
    this course has. That is a lot of scaffolding for a result students will not use before
    the ML course teaches ensembles properly. Meanwhile the failure it is adjacent to —
    being fooled by noise — is the one that actually costs them the course.
  if_kept_anyway:
    smallest_version: >
      Average several deliberately-imperfect models of the SAME regression already being
      fitted in lesson 5, and show the error drop below the best individual model. No new
      dataset, no classifier, no metric to introduce. Ten cells.
    note: >
      There is a pleasing symmetry worth one sentence if it is kept: ensembling is
      averaging noise away, and S3 is being fooled by noise. Same enemy, opposite move.

# ---------------------------------------------------------------------------------------
# The MCP checklist does not currently catch any of this
# ---------------------------------------------------------------------------------------

mcp_gaps:
  finding: >
    Audited goad_analysis_checklist against the two failures at the top of this file. Stage
    6 (verification) has the shuffle, the confounder and the held-out slice, so a student who
    reaches it is protected. But nothing before stage 6 asks about n or about the unit of
    analysis, and nothing anywhere asks how many comparisons were considered — which is the
    forking-paths failure, and it is invisible to every later check.
  fixes:
    - stage: question
      add: >
        "Did you have this question before you looked at the data, or after?" A question
        invented to fit a pattern already seen cannot be tested on the data that suggested
        it. This one question is the cheapest guard in the whole checklist.
    - stage: data
      add: >
        "What is the unit your CLAIM is about, and is it the same as one row?" This is S1,
        as a question. Rows that cluster within people are not independent observations of
        a person.
    - stage: shape
      add: >
        "How many INDEPENDENT units are behind each group you plan to compare?" With three
        people in a group, no summary is stable enough to compare, whatever the row count.
    - stage: verification
      add: >
        "How many comparisons did you consider before settling on this one?" Including the
        abandoned ones. The question is never whether this result is surprising, but whether
        the most surprising of many is.
  also:
    - >
      goad_distribution_method needs an n check up front — a fit to thirty points is a
      suggestion, not a finding.
    - >
      goad_critique_visual section 4 should ask whether the claim is "A beats B" or "A is
      first", because the second needs the whole ranking to be stable and almost never is.
  status: doing
  see: 04-mcp-integration.yml
