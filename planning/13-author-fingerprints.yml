# Lesson 5: the classifier is the instrument, the fingerprint is the finding
#
# Raoul's correction: "the interesting thing is not 'who is this', but rather, if we are able
# to predict who this is, then what is the pattern that tells us something about them?"
#
# Same inversion as the daily cycle in lesson 3. There the obvious pattern was the thing to
# subtract; here the accuracy number is the thing to subtract. What is left over -- the
# weights -- is the analysis.

meta:
  status: verified on data, 2026-08-10
  replaces: >
    The framing in 12-raid-cascade-verification.yml#author_attribution, which treated
    accuracy as the deliverable.
  data: 8 most active #ubuntu-uk authors, 218,670 messages, 2013-2017

the_inversion:
  wrong_framing: "Build a classifier. It gets 48.5% against a 22% baseline. Done."
  why_it_is_wrong: >
    48.5% is a number nobody learns anything from, and a visualisation course that ends on a
    accuracy score has quietly become a modelling course with worse tools.
  right_framing: >
    The classifier is a measuring instrument. Point it at people, read the coefficients, and
    it tells you which habits are identifying. The accuracy is not the result — it is the
    verification that the habits are real, which is stage 6 of the analysis checklist doing
    its job rather than being the point.
  the_sentence_for_the_notebook: >
    "You can tell these eight people apart. Now: what did the model notice, and would you
    have noticed it yourself?"
  leerdoel_it_finally_serves: >
    5.18 — "is in staat om de gewichten van een SGDRegressor te plotten en interpreteren".
    That leerdoel already exists and currently has nothing worth interpreting attached to it.

# ---------------------------------------------------------------------------------------
# What is actually in the data. All verified.
# ---------------------------------------------------------------------------------------

findings:

  - id: F1
    title: Three dialects for the same thing — a smile
    lead: true
    what: >
      Emoticon style splits the channel cleanly into three groups, and nobody mixes.
    numbers:
      nosed_smileys_pct: {zmoylan-pi: 99.4, diddledan: 97.4}
      noseless_pct: {MartijnVdS: 100.0, bigcalm: 100.0, daftykins: 100.0, foobarry: 99.7, ali1234: 99.8}
      unicode_pct: {popey: 57.5}
    reading: >
      Two people write ":-)" almost exclusively. Five write ":)" almost exclusively. One
      writes "☺", "☻", "☹" more than half the time — a dialect of one. The split is close to
      total: no author sits between 3% and 97%.
    why_it_is_the_lead: >
      It is completely unconscious, it is invisible without the analysis, it is instantly
      understandable once seen, and it is funny. That combination is rare and it is exactly
      what "reveals something you cannot see without the lens" means.
    mechanism:
      plausible: >
        The nose/no-nose split is a documented stylometric marker and tracks roughly with the
        era someone came online — the nosed form is the older convention. Unicode smileys
        need an input method most people never set up.
      status: name it as a hypothesis, not a conclusion
      the_honest_move: >
        This is a mechanism-plausible / evidence-strong claim, so it goes in the top-left
        cell of the credibility grid — but the mechanism is about a POPULATION and we have
        eight people. Say that out loud. It is the pseudoreplication lesson returning at
        exactly the moment students feel most pleased with themselves.

  - id: F2
    title: Who bothers with apostrophes
    what: share of contractions written as "dont" / "im" / "thats" rather than "don't"
    numbers: {popey: 43%, foobarry: 36%, MartijnVdS: 4%, bigcalm: 3%, ali1234: 3%, daftykins: 2%, zmoylan-pi: 1%, diddledan: 1%}
    reading: >
      A 40-point gap with almost nothing in between. Two people essentially never type the
      apostrophe; five essentially always do.
    why_it_belongs: >
      It is the single most transferable feature to the student's own data — every chat
      export has contractions, in every language with them.

  - id: F3
    title: Same channel, opposite clocks
    numbers:
      daftykins: {peak_hour: 22, share_0000_0500: 15.0%}
      foobarry: {peak_hour: 13, share_0000_0500: 0.0%}
    reading: >
      One person does a sixth of their talking between midnight and five. Another, in the
      same channel over the same five years, has literally never posted in that window.
    note: >
      This is the daily cycle from lesson 3 turned into a PER-PERSON feature. The channel
      average hid both of them. Good callback, and it makes the point that an aggregate is a
      claim about nobody in particular.

  - id: F4
    title: The fingerprint is a role, not just a habit
    what: >
      MartijnVdS's most identifying tokens are other people's names — "mungbean:",
      "daftykins:", "popey:", "bigcalm:". He opens 49% of his messages by addressing
      somebody. zmoylan-pi does it in 3%.
    reading: >
      The model did not learn a writing habit here, it learned a social position: one person
      answers others, one broadcasts. Same channel, different jobs.
    why_it_matters: >
      It is the case where "what the model noticed" is genuinely NOT what a student would
      have predicted, and it opens the question of what else is a role rather than a trait.

  - id: F5
    title: The habits do not drift, but the situations do
    method: split 2013-2014 against 2016-2017, correlate each author's rate across the gap
    numbers:
      addresses_by_nick: 0.98
      starts_with_a_capital: 0.95
      median_message_length: 0.93
      question_rate: 0.55
    reading: >
      Four years apart, the typing habits are almost perfectly preserved. Question rate is
      not — because asking questions is about what is happening that week, not about who you
      are.
    why_this_is_the_best_part: >
      It is the replication leg of the credibility grid (10-spurious-findings.yml#thread S5)
      arriving on its own, with a built-in contrast. A fingerprint that survives four years
      is a trait; one that does not was never a fingerprint. Students get to see both in the
      same plot, and the distinction is theirs to make rather than ours to assert.

# ---------------------------------------------------------------------------------------
# The notebook
# ---------------------------------------------------------------------------------------

notebook_shape:
  file: notebooks/05.1-relationships.ipynb (or its own 05.3 — decide when writing)
  order:
    - id: N1
      what: Can you tell them apart? Fit tf-idf + logistic regression. 0.485 against 0.220.
      length: three cells
      note: Deliberately brief. The number is a gate, not a destination.
    - id: N2
      what: So what did it notice? Pull the top coefficients per author.
      the_moment: >
        The token lists are the payoff and they read almost like character sketches. Show
        them raw before summarising — the "oh, THAT is what a fingerprint looks like" lands
        better from a messy list than from a clean bar chart.
    - id: N3
      what: Turn three of the coefficients into measured features, and plot them (F1, F2, F3).
      why: >
        Coefficients are suggestive; a rate over all messages is a measurement. This is the
        step from "the model likes this token" to "this person does this 43% of the time".
    - id: N4
      what: Is it style or is it topic?
      how: >
        ali1234's top tokens include "Qt", "QML", "xfce" — that is subject matter, not style.
        Strip topic vocabulary, refit, and see what survives. What remains is the fingerprint
        proper.
      why: >
        The best verification step in the notebook, and it is a question students can pose
        themselves once they have seen the token lists.
    - id: N5
      what: Does it hold four years later? (F5)
      why: replication, with the question-rate counter-example included
    - id: N6
      what: Your turn — the same four features on their own chat.
      transfers_cleanly: [emoticon style, apostrophes, capitalisation, hour profile, message length]
      the_hook: >
        "Can you tell who wrote this?" on their own group chat is the most engaging exercise
        in the course, and every feature above works on a WhatsApp export unchanged.

  what_this_does_NOT_become:
    - a model-tuning exercise — no hyperparameter search, no leaderboard
    - a deep-learning preview — tf-idf and logistic regression are the whole toolkit
    - an accuracy competition between students, which would reward exactly the wrong instinct

# ---------------------------------------------------------------------------------------
# Consequences
# ---------------------------------------------------------------------------------------

consequences:
  - id: C1
    file: 05-notebooks.yml
    change: >
      Replace 051-c's framing. Author fingerprints become the lesson-5 modelling section;
      the IRC activity model with release-day residuals stays as the timeseries-modelling
      half. Two models, two purposes — one predicts a series, one characterises people.
  - id: C2
    file: 08-learning-goals.yml
    change: >
      5.18 finally has a subject. Note that it is now assessed on interpreting author
      coefficients rather than on SGDRegressor weights in the abstract.
  - id: C3
    file: 10-spurious-findings.yml
    change: >
      Add F1 to the S5 worked examples as the case where the evidence is strong, the
      mechanism is plausible, and the sample is still eight people. It is the most seductive
      kind of finding and therefore the most useful one to interrogate.
  - id: C4
    open_question: >
      Whether ensembling helps is still unsettled (12-raid-cascade-verification.yml). It
      matters less now: under this framing, the reason to build a second model is that it
      notices DIFFERENT habits, not that it scores higher. That is a better motivation for
      5.7/5.8 than accuracy anyway, and it survives the ensemble failing to beat the single
      model.
    status: proposed
