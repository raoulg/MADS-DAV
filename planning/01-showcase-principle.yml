# The showcase principle — the structural fix for P1
#
# One rule, applied to every teaching notebook. Everything else in this refactor is detail.

meta:
  status: doing
  fixes: P1

the_rule:
  statement: >
    A technique is demonstrated on a dataset chosen so the pattern is unmissable, and only
    then applied to the student's own chat. The student's own data is where the technique is
    *used*, never where it is *introduced*.
  rationale: >
    A student who has already seen what a weekly cycle looks like can recognise its absence
    in their own data and say so. A student who has only ever seen their own flat line
    cannot tell a null result from a bug. Teaching the shape first turns "nothing happened"
    from a failure into a finding.

notebook_anatomy:
  description: Every teaching notebook gets the same four sections, in this order.
  sections:
    - id: 1
      name: The question
      content: >
        One sentence naming what we want to know and what kind of answer would count.
        Not "let's look at the data".
      length: a markdown cell
    - id: 2
      name: Showcase
      content: >
        The technique on a curated dataset (see 02-datasets.yml). The pattern is guaranteed
        present. Includes at least one deliberate *failure mode* — the same data plotted the
        wrong way — so the student sees what the technique protects them from.
      length: the bulk of the notebook
    - id: 3
      name: Your turn
      content: >
        The identical technique pointed at the student's own chat, with the code reduced to
        the smallest possible diff from the showcase. Explicitly states that a null result
        is a valid, reportable outcome.
      length: a handful of cells
    - id: 4
      name: What to write down
      content: >
        The claim the student should now be able to make or refute, in the vocabulary of
        the checklist (preattentive / gestalt / five guidelines).
      length: a markdown cell

fallback_data:
  problem: >
    "Your turn" still assumes the student has a working chat export. Some will not, on week
    one: no export yet, an unsupported locale, a corrupted file, a privacy objection.
  decision:
    what: A slice of common-pile/ubuntu_irc, vendored into data/showcase/.
    status: decided
    shape:
      columns: [timestamp, author, message, channel]
      after_parsing: matches data/processed/*.parq closely enough to reuse the same code
    why_real_not_synthetic: >
      Public Domain licence, already on the hub, and the raw log has to be regex-parsed into
      rows — which turns the fallback dataset into lesson 1's exercise instead of a freebie.
      Its limitations (minute resolution, tech-support content) are stated rather than
      hidden, which is more than a synthetic corpus could offer.
    full_reasoning: 02-datasets.yml#reference_chat

failure_modes_to_teach:
  description: >
    Each showcase must include the wrong version, not only the right one. These are the
    specific mistakes worth staging.
  by_family:
    categories:
      - a bar chart with 40 unordered categories
      - a proportion compared across groups of wildly different size
      - Simpson's paradox: the aggregate and the per-group trends disagree
    time:
      - a raw daily count so noisy the trend is invisible, next to a smoothed one
      - a rolling average wide enough to erase the thing being measured
      - a gap in the index silently plotted as a straight line
    distributions:
      - a mean and std reported for a long-tailed variable
      - a histogram whose bin count changes the conclusion
      - an "outlier" that is only an outlier under an assumed normal distribution
    relations:
      - Anscombe / Datasaurus: identical summary statistics, different pictures
      - a correlation driven entirely by a third variable
      - a linear fit through data that is obviously curved
    high_dimensional:
      - t-SNE clusters read as distances
      - PCA on unscaled features, dominated by the largest-unit column
      - a 2D projection presented without saying how much variance it kept

anti_patterns:
  - dont: Demonstrate on the student's own data and hope.
    do: Demonstrate on the showcase, then hand over the same code.
  - dont: Give the showcase its own bespoke plotting code the student cannot reuse.
    do: >
      Use the same goad_toolkit plot classes in both halves, so "your turn" is a change of
      dataframe and PlotSettings, nothing more.
  - dont: Present the correct plot only.
    do: Show the mistake first, name why it misleads, then fix it.
