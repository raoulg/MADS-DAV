# Which dataset showcases which visualisation type
#
# Selection rule, in priority order:
#   1. The quirk being taught must be UNMISSABLE in the data. That is the only reason a
#      dataset is on this list.
#   2. It must load without a download the first time it is used in class, or the lesson
#      dies on a conference-wifi. Seaborn's bundled sets and goad's own FileHandler win here.
#   3. Where a HuggingFace dataset is equally good, prefer it — it buys familiarity with the
#      API the ML course assumes (see 06-huggingface-migration.yml).
#   4. It must be small enough to re-run in a notebook without a coffee break.

meta:
  status: doing

tiers:
  tier_0_bundled:
    what: seaborn's bundled datasets (sns.load_dataset)
    why: >
      Zero-risk. Small, clean, famous, and every one of them was curated because it shows
      one thing clearly. This is the default for a showcase unless there is a reason not to.
    caveat: >
      sns.load_dataset fetches from GitHub on first use and caches. Pin them into the repo
      under data/showcase/ so a classroom without internet still works.
      status: todo
  tier_1_goad:
    what: datasets goad_toolkit already knows how to fetch (covid via FileHandler)
    why: Doubles as the worked example for the pipeline/model/residual loop.
  tier_2_huggingface:
    what: datasets.load_dataset from the hub
    why: Bridge to the ML course. Used where the content genuinely needs it (text, vectors).
  tier_3_generated:
    what: synthetic data generated in-notebook with numpy/scipy
    why: >
      The only way to teach "what does a lognormal actually look like" with ground truth.
      Distributions lesson leans on this heavily and should.

by_family:

  categories:
    lesson: 2
    primary:
      dataset: seaborn `penguins`
      tier: 0
      teaches: >
        Clean categorical comparison: three species x two sexes x three islands. Barplot,
        grouped barplot, heatmap of counts, and the palette/ordering decisions — all with
        differences big enough to survive a bad chart.
    quirk_showcase:
      dataset: UC Berkeley 1973 admissions (Simpson's paradox)
      tier: 3 (small enough to hardcode as a literal table)
      teaches: >
        Aggregate says the university discriminates; every department individually says the
        opposite. The single best 10-minute argument for why a categorical comparison must
        name its grouping. Directly serves leerdoel 4.8.
      note: >
        Currently Simpson's paradox is taught in lesson 4 (distributions). Moving the
        *demonstration* to lesson 2 where categories live, and keeping the distribution-side
        consequence in lesson 4, matches where students meet the mistake.
        status: proposed
    failure_showcase:
      dataset: seaborn `titanic`
      teaches: unordered high-cardinality bars, and proportions across unequal group sizes
    your_turn: messages per author, per weekday, per timestamp_category on the own chat

  time:
    lesson: 3
    primary:
      dataset: seaborn `flights`
      tier: 0
      teaches: >
        Textbook trend + multiplicative seasonality in 144 points. seasonal_decompose on it
        is unambiguous, which is exactly what a first decomposition needs to be.
    quirk_showcase:
      dataset: sunspots
      tier: 1 (already fetched in 03.2; move behind goad's FileHandler)
      teaches: >
        A cycle far longer than the sampling intuition suggests — the case where the Fourier
        view tells you something the eye does not. Already working in 03.2, keep it.
    regime_change_showcase:
      dataset: covid (RIVM by day, via goad FileHandler)
      tier: 1
      teaches: >
        A structural break (vaccination start) that a rolling average smooths away if the
        window is chosen carelessly. Pairs with the residual work in lesson 5.
    failure_showcase:
      what: the same flights series plotted raw / over-smoothed / with a hole in the index
      tier: 3 (derived from the primary)
    your_turn: messages per week, per day-of-week, first/last message of the day

  distributions:
    lesson: 4
    primary:
      dataset: generated — norm, lognorm, expon, poisson, weibull from scipy.stats
      tier: 3
      teaches: >
        What each family *looks like* before any real data is involved, plus the central
        limit theorem demo (leerdoel 4.6) which only works generated.
    real_data_showcase:
      dataset: seaborn `taxis` — trip duration and distance
      tier: 0
      teaches: >
        A genuine long tail in the wild. Mean and median disagree, log-transform rescues it,
        and the "outliers" turn out to be ordinary members of a lognormal.
      verify: >
        Confirm `taxis` ships with the seaborn version pinned in pyproject.toml. If not,
        fall back to `diamonds` (price) or `tips` (total_bill), both long-tailed.
    fitting_showcase:
      dataset: covid model residuals (goad demo/linear.py)
      tier: 1
      teaches: >
        DistributionFitter over a registry, KS test vs log-likelihood disagreeing, and
        PlotFits reading. This is the one place the *whole* goad stack is visible at once.
    your_turn:
      - messages per day (expect poisson-ish, over-dispersed)
      - seconds between messages (expect exponential within bursts, heavy tail overall)
      - message length in characters (expect lognormal)
      - word rank vs frequency (expect Zipf) — bridges into lesson 6

  relations:
    lesson: 5
    primary:
      dataset: seaborn `mpg`
      tier: 0
      teaches: >
        Scatter with hue/size/style, an obviously non-linear relation (weight vs mpg), and
        a lowess/polynomial fit that beats the straight line.
    quirk_showcase:
      dataset: Anscombe's quartet (`sns.load_dataset("anscombe")`) + the Datasaurus dozen
      tier: 0 / 3
      teaches: >
        Identical means, variances, correlations and regression lines; wildly different
        pictures. The single most efficient argument in the entire course for "plot it".
      note: Datasaurus is not bundled with seaborn — vendor the CSV into data/showcase/.
    correlation_showcase:
      dataset: seaborn `diamonds` or `penguins` correlation matrix
      tier: 0
      teaches: heatmap of .corr(), cmap choice, and why a strong correlation can be a proxy
    regularisation_showcase:
      dataset: keep the current SGDRegressor demo, re-pointed off mads_datasets
      teaches: L1/L2/elasticnet as feature selection (leerdoel 5.9)
    your_turn: message length vs hour, response time vs author, activity vs weekday

  high_dimensional:
    lesson: 6
    primary:
      dataset: swiss roll (`make_swiss_roll`) + MNIST/Fashion-MNIST
      tier: 0/2
      teaches: manifold hypothesis, PCA vs t-SNE, curse of dimensionality — already working
    text_showcase:
      dataset: a published VectorCache of sentence embeddings on the hub
      tier: 2
      teaches: >
        The embed-once boundary. Students load vectors somebody else computed, project them,
        and read the structure — instead of spending the lesson waiting for a model download.
      see: 06-huggingface-migration.yml
    quirk_showcase:
      what: the same embeddings under PCA and t-SNE, side by side, with perplexity swept
      tier: 3 (derived)
      teaches: t-SNE distances are not distances; PCA needs scaling; both need a variance number
    your_turn: own chat messages embedded and projected, clustered by author

# ---------------------------------------------------------------------------------------
# The reference chat corpus — a real dataset with the same schema as a student's export.
# Supersedes the synthetic reference-chat proposal in 01-showcase-principle.yml.
# ---------------------------------------------------------------------------------------

reference_chat:
  decision: Use common-pile/ubuntu_irc. Do not build a synthetic corpus.
  status: decided
  role:
    - the "your turn" stand-in when a student's own export is missing, thin, or refused
    - the showcase for any technique that needs chat-shaped data specifically
  dataset:
    id: common-pile/ubuntu_irc
    url: https://huggingface.co/datasets/common-pile/ubuntu_irc
    licence: Public Domain (stated in each row's metadata)
    size: 329,115 documents / 6.3 GB — a slice is what gets used
    span: 2004 to March 2025
    verified: 2026-08-10, via the HF datasets-server first-rows endpoint

  schema:
    one_row: one channel, one day
    fields:
      id: "'2015-04-17-#ubuntu-ir' — date plus channel"
      text: the whole day's log, one message per line
      created: the date, as a timestamp at midnight
      metadata: "{license, authors: [...nicks], url, channel}"
    line_format: |
      [13:39] <dark-sun> salam
      [13:51] <lubotu3`> dark-sun0: I am only a bot, please don't think I'm intelligent :)
      [13:51]  * dark-sun0 sighs...

  why_this_one:
    - id: C1
      claim: The licence is actually clean.
      detail: >
        Public Domain, already published, already on the hub. Every alternative that has
        real conversational structure — Telegram, Discord, WhatsApp donations, Reddit
        scrapes — is somebody's personal data being redistributed to a cohort.
    - id: C2
      claim: Parsing it IS lesson 1.
      detail: >
        The raw text has to be turned into (timestamp, author, message) rows with a regular
        expression, and the action form (`* nick verbs`) needs a second pattern. That is
        leerdoel 1.7 and 1.11, on real data, with a real payoff — and it is the same shape
        as what the WhatsApp preprocessor does to their own export.
    - id: C3
      claim: The full-timestamp reconstruction is a real exercise.
      detail: >
        The date is on the row, the time is inside the text. Combining them is exactly the
        kind of un-glamorous join that breaks student analyses silently.
    - id: C4
      claim: Bot filtering is a free extra exercise.
      detail: >
        The dataset card says known bots were removed; `lubotu3\`` is in the very first
        sample row. So students get to discover that "cleaned" data is not clean, which is a
        better lesson than any assertion about it.
    - id: C5
      claim: There is real, checkable ground truth.
      detail: >
        Ubuntu releases land on known dates every six months, and traffic in the support
        channels spikes around them. "Find the regime change and name the date" has an
        objectively right answer, from real data — which is what the synthetic corpus was
        going to be built to fake.
      status: verify

  honest_limitations:
    - id: L1
      what: Minute resolution, no seconds.
      consequence: >
        Inter-message gaps are quantised to whole minutes with a pile of zeros, so the
        clean continuous-exponential fit from lesson 4 does not work on this corpus.
      response: >
        Turn it into the lesson: on IRC the gap is a DISCRETE variable (geometric /
        negative binomial), on WhatsApp it is continuous (exponential). Same mechanism,
        different measurement resolution, different family. That is a better distributions
        lesson than either one alone — and it is exactly the discrete-vs-continuous call
        from stage 3 of the analysis checklist.
    - id: L2
      what: "#ubuntu is a global channel, so the daily cycle is washed out across timezones."
      response: >
        Use a regional channel — #ubuntu-nl, #ubuntu-de, #ubuntu-fr, #ubuntu-ir — where the
        participants share a timezone and the daily cycle is sharp. Comparing a regional
        channel against #ubuntu is itself a nice demonstration of why the cycle exists.
      status: verify
      check: >
        Confirm at least one regional channel has enough volume over a 2-3 year window.
        Filter rows on metadata.channel, count parsed messages per day.
    - id: L3
      what: Tech support, not personal chat.
      consequence: >
        The content is nothing like a friend group. Message length, vocabulary and the
        question/answer rhythm all differ.
      response: >
        Say so out loud. The corpus is a structural stand-in — multi-author, timestamped,
        bursty, long-tailed — not a content stand-in. Where content matters (sentiment,
        vocabulary per author), the student's own data is the point and the corpus is only
        a worked example.
    - id: L4
      what: A slice has to be chosen and pinned.
      response: >
        Vendor one channel over a fixed date range into data/showcase/ as a parquet, so
        every student analyses the same rows and nobody downloads 4.7 GB. Ship the
        selection script next to it so the choice is visible.

  actions:
    - id: R1
      todo: Pick the channel + date range; verify volume and that the daily cycle is visible.
    - id: R2
      todo: Write the slice script (filter -> parse -> parquet) and vendor the output.
    - id: R3
      todo: >
        Write the regex-parsing step as the lesson-1 showcase, including the action-line
        form and the bot-filtering discovery.
    - id: R4
      todo: Confirm the Ubuntu-release traffic spike is actually visible before building an
        exercise on it.

rejected_alternatives:
  - id: A1
    what: A synthetic reference chat, generated from the statistics of a real chat.
    why_rejected: >
      It was invented to solve a licence problem that ubuntu_irc does not have, and it
      would have cost a generator to build, tune and defend. Real data with a stated
      limitation beats synthetic data with a hidden one. Its one advantage — known ground
      truth — is matched by the Ubuntu release dates (C5).
    keep_in_mind: >
      If R1/R4 fail badly, this comes back. It is a fallback, not a dead idea.

  - id: A2
    what: Scraping a public Telegram group.
    why_rejected: >
      Technically easy — Telegram Desktop exports a group to JSON, and Telethon does it
      programmatically. That is not the problem. The problem is that "public group" is not
      a licence: the messages are personal data of people who never agreed to be
      redistributed, redistributing them to a cohort is processing under GDPR, and
      anonymising hard enough to fix that destroys the authorship signal the course needs.
      Telegram's own terms also restrict bulk collection.
    but: >
      Perfectly reasonable as an OPTIONAL exercise for an individual student who wants a
      second dataset — they export a group they are already in, exactly as they export
      their own WhatsApp. Same consent situation, and it never leaves their laptop. Worth a
      sentence in lesson 1 as an alternative for students who cannot or will not use
      WhatsApp.
    status: proposed

  - id: A3
    what: Reddit comment dumps (SocialGrep/*, HuggingFaceGECLM/REDDIT_comments).
    why_rejected: >
      They do have author + created_utc + body, and they are large. But threaded forum
      comments are not a conversation with a daily rhythm between known people, so the
      time-series and per-author halves of the course land much more weakly. Also a murkier
      licensing story than Public Domain.
    good_for: >
      A backup source of long-tailed text if lesson 4 needs a second real example.

  - id: A4
    what: LLM-conversation datasets (WildChat, chatbot_arena, ShareChat, Topical-Chat).
    why_rejected: >
      These are human-to-model transcripts. One human, one machine, no group dynamics, no
      daily rhythm belonging to a person, and the "authors" are a user and an assistant.
      Wrong shape for every lesson in this course.

actions:
  - id: D1
    todo: Vendor tier-0 datasets into data/showcase/ so no lesson depends on a live fetch.
  - id: D2
    todo: Vendor the Datasaurus dozen CSV.
  - id: D3
    todo: Verify seaborn `taxis` availability against the pinned seaborn version.
  - id: D4
    todo: Move the sunspots fetch in 03.2 behind goad_toolkit's FileHandler.
  - id: D5
    todo: See reference_chat.actions R1-R4 — supersedes the old "build a synthetic chat".
