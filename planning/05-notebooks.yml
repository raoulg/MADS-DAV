    leerdoelen: [6.3, 6.7, 6.8, 6.9, 6.10, 6.13, 6.14]

  - file: notebooks/06.2-modelling.ipynb
    lesson: 6
    now: >
      CountVectorizer + PCA + manhattan distance clustering of own chat messages, via
      wa_analyzer.model.TextClustering. Has uncommitted work in progress.
    target: >
      The n-gram/count-vector half of lesson 6, kept — it is a genuinely good "what is a
      vector, before embeddings" step and it works on any chat.
    change:
      - id: 062-a
        do: Resolve the uncommitted changes before touching anything else.
        status: todo
        blocking: true
      - id: 062-b
        do: Add a showcase on a text dataset with known classes, so clustering can be checked.
      - id: 062-c
        do: >
          Frame CountVectorizer explicitly as the cheap hand-designed alternative to an
          embedding, and keep it as the baseline the embeddings in 06.4 must beat.
    leerdoelen: [6.11, 6.12]

  - files: [notebooks/6.3.1-tanach_ingest.ipynb, notebooks/6.3.2-tanach_preprocess.ipynb, notebooks/6.3.3-tanach_model.ipynb]
    lesson: 6
    now: A three-notebook ingest/preprocess/model chain on the Tanach.
    target: retired
    status: decided
    decision: Remove all three. They do not add anything the rest of lesson 6 does not cover.
    change:
      - id: 063-a
        do: Delete the three notebooks.
      - id: 063-b
        do: >
          Check whether wa_analyzer.model.TextClustering is used anywhere else before
          removing it — 06.2 and 6.3.3 both import it.
        blocking: true
      - id: 063-c
        do: >
          Salvage the ingest idea, not the notebook: "fetch a text corpus and regex it into
          rows" is now lesson 1's job, done on ubuntu_irc where it has a purpose.
    freed_up: >
      Three notebooks of lesson-6 surface. Spend it on the vectorcache/cosine-similarity
      material below, which needs the room.

  - file: notebooks/6.4_huggingface.ipynb
    lesson: 6
    now: >
      transformers.pipeline for sentiment, SentenceTransformer to embed own messages, then
      PCA/t-SNE and a distance matrix. Every student downloads and runs a model before
      seeing anything.
    target: >
      Rebuilt around two ideas that are currently missing: what a vector space actually
      looks like when it is well organised, and what "one row" means when your rows are
      three-word messages. Split into two notebooks — the material no longer fits in one,
      and the tanach notebooks freed the room.
    status: redesigned
    note: >
      This is a redesign, not a port. The lesson does not need to survive in its current
      shape; the leerdoelen do.

    new_structure:

      - file: notebooks/06.4-vectorspaces.ipynb
        title: What a vector space looks like when it is organised
        sections:
          - id: A1
            what: Load pttrn-io/oxford-flowers-dinov2-small with VectorCache.from_hub.
            why: >
              One line, a few megabytes, no model download, no waiting. The whole
              embed-once boundary arrives as a convenience before it ever arrives as a
              doctrine.
          - id: A2
            what: PCA the test vectors to 2D for ~8 of the 102 classes and plot them.
            why: >
              Eight tight clusters out of a LINEAR projection of raw encoder output, with
              nothing trained. This is the picture that makes "the representation is doing
              the work" a visual fact rather than a claim. It is also the best possible
              motivation for lesson 6's whole premise.
            note: >
              torch.pca_lowrank does this without adding a dependency; the ML course's
              notebooks/1_pytorch_intro/01_the_cache.ipynb has the exact cell.
          - id: A3
            what: Cosine similarity, properly explained.
            why: >
              DAV is the right place for this and currently skips it. It is geometry, it is
              a metric (leerdoel 6.6), and the one property that matters — it ignores
              magnitude, only direction — is precisely why it survives comparing a
              three-word message to a paragraph. Contrast against euclidean and manhattan
              (leerdoel 6.11), which do not.
          - id: A4
            what: The 1-nearest-neighbour baseline — normalise, dot, argmax, compare labels.
            why: >
              Four lines, no loss, no optimizer, no parameters, 99.1% on 102 fine-grained
              classes. Reproduces the ML course's lesson-1 hook, so students meet it once as
              a visualisation result and again as a modelling result.
            payoff_for_dav: >
              It is also the honest answer to "is this cluster structure real, or is it my
              projection?" — the 1-NN score is computed in the ORIGINAL 384-dimensional
              space, so it verifies what the 2D picture only suggests. That is stage 6
              (verification) of the analysis checklist, on a question students actually
              have.
          - id: A5
            what: Stage the failure — the same projection with unscaled features, and t-SNE
              at four perplexities.
            why: 061-a and 061-b belong here now that there is a dataset worth doing them on.
        source: >
          MADS-MachineLearning-course/notebooks/1_pytorch_intro/01_the_cache.ipynb §1.1-§1.2
          is the direct model for A1, A2 and A4. Reuse the cells; rewrite the framing for a
          visualisation course.

      - file: notebooks/06.5-your-own-vectors.ipynb
        title: What is one row, when a row is "haha"?
        premise: >
          The flowers cache works because one row is one flower. Chat data has no such
          luck: a large share of messages are under five words, and a three-word message
          embeds to something almost content-free. Embedding messages one at a time and
          projecting the result gives an undifferentiated blob — and the student cannot
          tell whether that means "no structure" or "wrong unit of observation".
        sections:
          - id: B1
            what: Stage the blob. Embed individual messages, project, look at nothing.
            why: >
              The failure has to be seen before the fix means anything. And the diagnosis —
              "this is a stage 2 problem, not a stage 4 problem" — is the transferable part.
          - id: B2
            what: Merge messages into conversational units, three ways.
            options:
              - fixed window of N consecutive messages
              - time-gap sessionization — start a new unit when the gap exceeds a threshold
              - per author, per day
            why: >
              Three defensible choices with different consequences is a better exercise than
              one right answer.
          - id: B3
            what: Get the gap threshold from lesson 4's fitted distribution.
            why: >
              THE callback of the course. In lesson 4 the student fitted the distribution of
              time-between-messages and found it is not one distribution — it is a fast
              within-burst regime and a slow between-burst regime. The crossover between
              them IS the session boundary. A parameter that would otherwise be guessed is
              read off a fit they already did, on their own data.
            status: proposed
            check: >
              Confirm the two-regime structure is visible enough on a typical chat to give a
              defensible threshold. If it is not, fall back to sweeping the threshold and
              showing that the answer depends on it — which is the same lesson, less neatly.
          - id: B4
            what: Evaluate the merge, do not just admire it.
            how: >
              On the IRC corpus, jkkummerfeld/irc-disentanglement provides human-annotated
              reply-to links for a subset of #ubuntu, so a sessionization can be scored
              against ground truth rather than eyeballed.
            status: verify
            check: >
              Confirm the annotated subset overlaps the channel/date slice chosen in
              02-datasets.yml#reference_chat. If it does not, either move the slice or drop
              this to an optional section.
          - id: B5
            what: Cosine similarity on the merged units.
            uses:
              - nearest-neighbour retrieval — "which conversation is most like this one",
                which is checkable by reading both
              - a session-by-session similarity matrix ordered by time; recurring topics
                show up as off-diagonal blocks
              - per-author centroids, and whether sessions can be attributed by cosine
                similarity to them — the flowers 1-NN baseline, transposed onto their data
          - id: B6
            what: Keep the CountVectorizer baseline from 06.2 and race it against embeddings.
            why: >
              Same comparison as before, now on a fair unit of observation. The cheap
              interpretable representation wins often enough on small data that the result is
              worth the demonstration, and it is the hand-designed-versus-learned thread the
              ML course continues.
          - id: B7
            what: Keep the sentiment pipeline as a short closing section.
            why: Small, fast, and the students enjoy it.

    the_bridge_worth_naming:
      claim: >
        DAV and the ML course meet at the same shape from opposite directions.
      detail: >
        ML lesson 5 (notebooks/4_language/03_long_documents.ipynb) has documents too LONG
        for the context window: split into chunks, get (C, D), aggregate back. DAV lesson 6
        has messages too SHORT to carry meaning: merge into units, get (C, D), aggregate
        back. Same tensor, same padding problem, same aggregator — opposite cause. Say this
        explicitly in one paragraph at the end of 06.5; it is the cheapest possible
        preparation for tensordtype 2.

    leerdoelen:
      covered: [6.4, 6.6, 6.11, 6.17, 6.18]
      new: [6.19]
      note: >
        6.17 (transformers.pipeline) survives but demoted — it is the closing section, not
        the opening act.

  - file: notebooks/7.0_social_graphs_dashboard.ipynb
    lesson: 7
    now: Network analysis demo feeding the streamlit dashboards.
    target: Unchanged in content; imports goad plot classes so week-2 plots render in the dashboard.
    change:
      - id: 070-a
        do: Renumber to 07.1.
      - id: 070-b
