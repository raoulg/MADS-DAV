    change:
      - id: 101-a
        do: Re-target the inheritance examples at goad's TransformBase / BasePlot.
      - id: 101-b
        do: Renumber to 00.1 / 00.2 so they sort first.
        status: proposed

cross_cutting_edits:
  - id: X1
    do: Delete every `import warnings; warnings.filterwarnings("ignore")`.
    why: >
      It hides the pandas/seaborn deprecation warnings that are the single most common
      source of "it worked last year" breakage, and it teaches students to silence signal.
  - id: X2
    do: Replace the tomllib/config.toml preamble with a single helper import.
    why: Four cells of boilerplate at the top of every notebook is four cells of noise.
  - id: X3
    do: Every notebook runs top-to-bottom on the reference chat with no config.toml present.
