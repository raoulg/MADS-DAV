    leerdoelen: [7.1, 7.5, 7.6]

  - files: [notebooks/101_classes.ipynb, notebooks/102_paths.ipynb]
    lesson: 0
    now: Python primers on classes/dataclasses and paths.
    target: >
      Keep, and point 101_classes at goad — the inheritance section should subclass
