# Per-notebook refactor spec
#
# For each notebook: what it is now, what it should become, and the concrete edits.
# `showcase` / `your_turn` refer to the two halves defined in 01-showcase-principle.yml.

meta:
  status: todo
  conventions:
    naming:
      problem: >
        Numbering is inconsistent — 06.1, 06.2 but 6.3.1, 6.3.2, 6.4, 7.0. Sorting in a file
        browser is already wrong.
      decision: Zero-pad every leading number and use two levels max — 06.1 … 06.5, 07.1.
      status: proposed
    every_notebook_ends_with: a "what to write down" markdown cell
    every_notebook_starts_with: a one-sentence question, not an import block

notebooks:

  - file: notebooks/01-cleaning.ipynb
    lesson: 1
    now: >
      Loads the raw preprocessed csv, clips/cleans, hashes authors with humanhasher, adds
      is_topk, writes a .parq. Entirely own-data, which is correct for this notebook.
    target: >
      Same job, restructured as a goad Pipeline. Regex enrichment becomes the student's own
      TransformBase subclass rather than loose cells.
    keep:
      - the whole own-data premise — this notebook is the one place it belongs
      - humanhasher anonymisation
    change:
      - id: 01-a
        do: Rewrite the cleaning steps as goad Pipeline steps.
        needs: [G6 FileHandler generalisation]
      - id: 01-b
        do: >
          Introduce RegexFeature and have the student add two features of their own
          (emoji count, question marks, URLs, mentions — their choice).
        needs: [G5]
      - id: 01-c
        do: >
          Add a showcase half: run the same pipeline on the reference chat, so a student
          without an export still finishes the lesson and has something to compare to.
        needs: [reference-chat, 02-datasets.yml]
      - id: 01-d
        do: Add the "your data is thin" escape hatch, explicitly and without shame.
    leerdoelen: [1.7, 1.10, 1.11]

  - file: notebooks/02-comparing_categories.ipynb
    lesson: 2
    now: >
      Barplots, palettes, groupby/agg, pd.cut — all directly on the student's own chat.
      Textbook case of P1: a two-person chat has no interesting categories.
    target: >
      Showcase on penguins (clean comparison) + Berkeley admissions (Simpson's paradox) +
      titanic (the failure modes). Your-turn on own-chat author/weekday/category counts.
    change:
      - id: 02-a
        do: Add the penguins showcase — barplot, grouped barplot, heatmap, palette choice.
        needs: [G1]
      - id: 02-b
        do: >
          Add the Simpson's paradox demonstration, moved here from lesson 4 where it is
          currently taught without a categorical picture to hang it on.
        status: decided
      - id: 02-f
        do: >
          Add the pseudoreplication demo: the same group comparison at two units of
          analysis, side by side. Bar chart over all messages (n=4000, overwhelming) next to
          one point per author (n=5, completely overlapping). Name the error.
        see: 10-spurious-findings.yml#thread S1
        why: >
          This is the error that fails students. It belongs in lesson 2 because lesson 2 is
          where they first compute a group difference — install the habit before they have
          five weeks of practice doing it wrong.
      - id: 02-g
        do: >
          Add the ranking-illusion demo: a caterpillar plot of per-author means with
          bootstrap intervals, sorted. The intervals overlap almost entirely. Then bootstrap
          the ranking itself and count how often the top author stays top.
        needs: [G1 caterpillar plot as a BasePlot subclass]
      - id: 02-c
        do: >
          Add the failure gallery: 40 unordered bars, proportions across unequal groups,
          rainbow palette on an ordered variable.
      - id: 02-d
        do: Barbell plot showcase (paired before/after), which has no other home in the course.
        needs: [G1]
      - id: 02-e
        do: Reduce the own-data half to the same code with a different dataframe.
    leerdoelen: [2.5, 2.6, 2.7, 2.8, 4.8]

  - file: notebooks/03-time.ipynb
    lesson: 3
    now: >
      isoweek/day_name extraction, reindexing to fill gaps, rolling average, FacetGrid per
      weekday, plotly area chart, and a two-author-only "who texts first" section that
      silently breaks for group chats.
    target: >
      Showcase on flights (trend + seasonality, unmissable) and covid (regime change).
      Your-turn keeps the best of the current content, with the two-author section gated
      behind an explicit check rather than a comment saying it only works for two authors.
    change:
      - id: 03-a
        do: Add the flights showcase — raw vs rolling vs over-smoothed, side by side.
      - id: 03-b
        do: >
          Teach the reindex-to-fill-gaps step ON the showcase, where a deliberate hole is
          punched into the index so the student sees the straight-line lie it causes.
      - id: 03-c
        do: Replace the .dt boilerplate with a TimeFeatures pipeline step.
        needs: [G4]
      - id: 03-d
        do: >
          Make the two-author section conditional, with a group-chat alternative (who
          starts a thread / who ends it, over the top-k authors).
      - id: 03-e
        do: Keep the plotly area chart; it is the one interactive moment in the course.
      - id: 03-f
        do: >
          Add the IRC half: messages per day and per hour for one channel, decomposed the
          same way flights was. Weekly cycle with a weekend dip, a sharp daily cycle on a
          regional channel, a multi-year decline, and release-day spikes.
        why: >
          flights teaches the technique on a textbook series; IRC teaches it on a
          human-activity series, which is the shape their own data has and where the
          technique actually gets tested. Twenty years of span also lets trend and cycle be
          separated honestly — which their own six-month chat cannot do, and they should
          know that before they try.
        status: proposed
    leerdoelen: [3.3, 3.8, 3.9, 3.10, 3.11, 3.12]

  - file: notebooks/03.2-statistics-of-time.ipynb
    lesson: 3
    now: >
      Sunspots + Fourier + seasonal_decompose + Savitzky-Golay/Butterworth filters. Already
      built on the showcase principle — this notebook is the model for the others.
    target: Mostly unchanged. Bring the data access and the plots into goad.
    change:
      - id: 032-a
        do: Fetch sunspots through goad's FileHandler instead of a raw requests call.
        needs: [G6]
      - id: 032-b
        do: Wrap decompose/ACF output in goad plot classes for consistent makeup.
        needs: [G4 DecomposePlot/ACFPlot]
      - id: 032-c
        do: >
          Add a short your-turn: run the same decomposition on the student's own daily
          message count, and expect a 7-day period.
    note: This is the reference for what a refactored notebook looks like.
    leerdoelen: [3.4, 3.5, 3.6, 3.7, 3.13, 3.14]

  - file: notebooks/04.1-distributions.ipynb
    lesson: 4
    now: 7 cells, own-data only, effectively a stub.
    target: >
      The main distributions lesson. Generated showcase for each family (what does a
      lognormal LOOK like), CLT demo, taxis for a real long tail, then your-turn on four
      chat-derived variables with a stated expectation for each.
    change:
      - id: 041-a
        do: Build the generated-families gallery — norm/lognorm/expon/poisson/weibull/pareto.
      - id: 041-b
        do: CLT demo (leerdoel 4.6) — sums of anything converge, which is why normal is common.
      - id: 041-c
        do: >
          Long-tail showcase on taxis — mean vs median, log transform, and "outliers" that
          turn out to be ordinary members of a lognormal.
      - id: 041-d
        do: >
          Your-turn with a stated hypothesis per variable: messages/day → poisson-ish and
          over-dispersed; gaps → exponential within bursts, heavy overall; length →
          lognormal; word rank → power law.
      - id: 041-e
        do: Use goad HistogramPlot/DistPlot/ECDFPlot throughout.
        needs: [G3]
      - id: 041-f
        do: >
          Add the null-distribution section: take a group difference, shuffle the labels a
          thousand times, histogram the results, draw the observed value on it as a vertical
          line. The finding sits inside the bulk.
        why: >
          A null distribution IS a distribution, so it belongs in this lesson, and it needs
          no test, no assumption and no table of critical values — it produces a picture,
          which is this course's register. A student who has seen their own finding sitting
          comfortably in the middle of the null does not need a p-value explained to them.
        see: 10-spurious-findings.yml#thread S2
        leerdoel: 4.17
        needs: [a NullDistribution helper in goad — see 03-goad-integration.yml]
      - id: 041-g
        do: >
          Extend 041-f: run the same estimate at n = 10, 30, 100, 300 authors, for a real
          effect (hour-of-day activity) and a fake one (permuted labels), on the same axes.
          The real one narrows around a non-zero value; the fake one narrows around zero;
          at n=10 they are indistinguishable.
        why: >
          Without this, lesson 4 teaches only that findings evaporate. This is the half that
          says some things are knowable and shows what they cost — and it retroactively
          explains lesson 2's n=3 case with a picture instead of an assertion. It also gives
          students the sentence they never write: "with five authors, an effect would have to
          be enormous before I could see it."
        see: 10-spurious-findings.yml#thread S4
        blocked_on: the IRC slice — verify the two curves actually separate before writing it
        status: proposed
    leerdoelen: [4.2, 4.3, 4.4, 4.5, 4.6, 4.7, 4.9, 4.17, 4.18]

  - file: notebooks/04.2-distribution_fitting.ipynb
    lesson: 4
    now: >
      Normality testing, qq-plots, scipy fitting, two-sample tests. Imports mads_datasets.
    target: >
      The goad DistributionFitter lesson. Showcase on covid residuals (where the answer is
      known and interesting), your-turn on the student's own four variables from 04.1.
    change:
      - id: 042-a
        do: Remove mads_datasets. (P4)
        needs: [06-huggingface-migration.yml]
      - id: 042-b
        do: Replace the hand-rolled fitting loop with DistributionFitter + PlotFits.
      - id: 042-c
        do: >
          Teach KS-vs-log-likelihood disagreement explicitly — goad already marks both, and
          the case where they pick different winners is the most instructive thing here.
      - id: 042-d
        do: Add the qq-plot as a goad QQPlot, not a scipy.probplot one-liner.
        needs: [G3]
      - id: 042-e
        do: >
          Exercise: register a distribution goad does not ship (pareto for the word-frequency
          data) and re-run the fit. This is the extensibility lesson, made concrete.
        needs: [G7]
    leerdoelen: [4.10, 4.11, 4.12]

  - file: notebooks/05.1-relationships.ipynb
    lesson: 5
    now: Scatterplots and "the map is not the terrain", on mads_datasets + own data.
    target: >
      Showcase on Anscombe + Datasaurus (the argument), then mpg (real non-linearity, hue,
      size, lowess), then the full GOAD loop: model → fit → residual → distribution of the
      residual, on covid.
    change:
      - id: 051-a
        do: Remove mads_datasets.
      - id: 051-b
        do: Lead with Anscombe/Datasaurus. Nothing else in the course argues this well.
      - id: 051-c
        do: >
          Model IRC daily activity from scratch — trend plus weekly seasonality — following
          the structure of goad_exercises/notebooks/01 and demo/linear.py. The residual
          contains the Ubuntu release-day spikes.
        why: >
          Same method as the covid worked example, second dataset, on the corpus they
          already decomposed in lesson 3 and fitted distributions to in lesson 4. covid stays
          as the script they READ; IRC is what they DO.
        see: [07-goad-exercises-reuse.yml, 10-spurious-findings.yml#lesson_5_replacement]
        status: proposed
      - id: 051-d
        do: Use goad ScatterPlot/RegPlot.
        needs: [G2]
      - id: 051-e
        do: >
          Add the forking-paths trap: hand out the IRC corpus with a randomly assigned
          "cohort" label per author, ask for the most interesting difference between cohorts
          from a list of fifteen candidate metrics, let everyone find something, then reveal
          the labels were random. Put 1 - 0.95^15 = 0.54 on the board.
        why: >
          This is the failure that actually fails students, and being told about it changes
          nobody's behaviour. They have to walk into it. It catches the whole room at once,
          which makes it a shared discovery rather than a humiliation.
        see: 10-spurious-findings.yml#thread S3
        ordering: >
          Must land AFTER Anscombe/Datasaurus (a statistic can hide the picture) and BEFORE
          051-f and 051-c. Deflation followed by a genuine result is a lesson; deflation
          alone is cynicism.
        status: proposed
      - id: 051-f
        do: >
          Add the credibility grid: mechanism against evidence as a 2x2, with the seven
          worked claims run through it in order — from "fewer messages at 4am" (mechanism so
          strong the test is a formality) through "longer messages on weekdays" (where the
          test genuinely decides) to the alphabet claim and the 4th-floor claim (significant,
          no mechanism, go find the confounder).
        why: >
          The constructive counterpart to 051-e, and the answer to "so is anything ever
          real?". The right response differs for every one of the seven examples, which is
          what makes "always be sceptical" visibly not the lesson. It also produces the two
          outputs students never write: "plausible but unproven, here is what would settle
          it", and "significant but no mechanism, so I went looking for the confounder".
        see: 10-spurious-findings.yml#thread S5
        ordering: immediately after 051-e, same session — the deflation must not stand alone
        pairs_with: 041-g, which supplies the sample size that answers "what would settle it"
        status: proposed
    leerdoelen: [5.2, 5.3, 5.9, 5.10, 5.11, 5.12, 5.13, 5.14, 5.15, 5.20, 5.21]

  - file: notebooks/05.2-correlation.ipynb
    lesson: 5
    now: Correlation heatmap, SGDRegressor with L1/L2/elasticnet, on mads_datasets.
    target: Same content, off mads_datasets, with a correlation showcase that has a confounder in it.
    change:
      - id: 052-a
        do: Remove mads_datasets.
      - id: 052-b
        do: >
          Add a showcase where a strong correlation is entirely explained by a third
          variable, so "correlation is not causation" is demonstrated rather than asserted.
      - id: 052-c
        do: Use goad CorrelationHeatmap.
        needs: [G2]
      - id: 052-d
        do: >
          Keep the regularisation-as-feature-selection material; it is the bridge to the ML
          course and the only place L1/L2 is taught before it.
    leerdoelen: [5.5, 5.6, 5.9, 5.16, 5.17, 5.18]

  - file: notebooks/06.1-dimensionality_reduction.ipynb
    lesson: 6
    now: SVD/PCA theory, MNIST, swiss roll, t-SNE. Already showcase-shaped and good.
    target: Mostly unchanged; add the t-SNE failure modes and a variance-explained discipline.
    change:
      - id: 061-a
        do: >
          Add the perplexity sweep — same data, four perplexities, four different "cluster
