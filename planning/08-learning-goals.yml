# ---------------------------------------------------------------------------------------
# The one open leerdoelen question, written out because "review 5.7/5.8" was too terse.
# ---------------------------------------------------------------------------------------

the_crowds_question:
  what_they_say:
    5.7: >
      begrijpt "wisdom of the crowd" en hoe dit zich vertaalt in de "condorcet jury theorem"
    5.8: >
      begrijpt de diversity prediction theorem en wat de aannames zijn waaronder deze
      theorem geldig is
  the_problem:
    - >
      They are the only two goals in lesson 5 that no notebook touches. 05.1 is scatterplots
      and the map/territory framing; 05.2 is correlation and regularisation. Neither mentions
      a crowd. So they are currently taught in slides only, and assessed not at all.
    - >
      They also sit oddly next to their neighbours. Lesson 5's other goals are about the
      relationship between two variables. These two are about aggregating many independent
      estimates, which is a different subject.
  what_they_actually_are: >
    Both are statements that averaging independent estimates beats the average individual
    estimate. Condorcet is the discrete/voting version; the diversity prediction theorem is
    the continuous version and is an identity, not an approximation:
    crowd error = average individual error - diversity. Their shared assumption —
    independence — is also exactly what makes them fail in practice, and that failure is
    worth more classroom time than the theorems.
  options:
    - id: O1
      what: Move both to lesson 4, next to the central limit theorem.
      argument: >
        The CLT, Condorcet and the diversity prediction theorem are the same idea in three
        costumes: independent errors cancel. Taught together they reinforce each other, and
        lesson 4 already has the simulation machinery (and, with the Monte Carlo section
        from goad_exercises, a way to demonstrate all three by resampling rather than by
        assertion).
      cost: lesson 4 is already the densest lesson in the course.
    - id: O2
      what: Keep them in lesson 5 and give them a notebook section.
      argument: >
        There is a real hook: the diversity prediction theorem is an ensemble statement, and
        lesson 5 already teaches regularisation, overfitting and "the map is not the
        territory". Averaging several deliberately-imperfect models and watching the error
        drop below the best individual model is a ten-cell demo and lands the point harder
        than any theorem statement.
      cost: >
        lesson 5 gains a third subject on top of relations and regularisation.
    - id: O3
      what: Drop them.
      argument: >
        Nothing else in the course depends on them and the ML course teaches ensembles
        properly.
      cost: >
        They are genuinely good ideas and the "independence is the assumption that fails"
        point is one students carry into working life.
  recommendation: O2
  reasoning: >
    The demo is cheap, it is a visualisation (error versus number of models averaged, with
    the diversity term shaded), and it gives lesson 5's "the map is not the territory" a
    constructive counterpart: one map is wrong, several disagreeing maps are less wrong. O1
    is the tidier taxonomy but overloads the lesson that is already carrying the most.
  needs_decision_from: Raoul

