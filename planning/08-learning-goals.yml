    - what: >
        Add a fourth section, "Wat beweer je?" — what claim does this plot support, and what
        would falsify it?
      status: proposed
  why: >
    The three current sections judge the picture. None of them judge whether it answers a
    question, which is the thing the rubric actually rewards.

rubric_and_the_credibility_grid:
  status: proposed
  what: >
    The rubric should reward the grid from 10-spurious-findings.yml#thread S5. Specifically:
    a submission reporting "plausible, unproven, and here is the sample size that would
    settle it" should score ABOVE one reporting a significant difference with no mechanism
    named.
  why: >
    Everything in the spurious-findings thread is advice the current incentive contradicts.
    If the rubric rewards producing findings, students will produce findings, and no amount
    of lesson-5 material will outweigh that.
  concretely:
    - Credit for naming the mechanism, or for stating explicitly that there is none.
    - Credit for a replication attempt — another period, another group, a second measure.
    - Credit for reporting how many comparisons were considered.
    - >
      A null result, honestly bounded, is a pass. It should be said out loud in week one,
      because students otherwise reverse-engineer a finding rather than hand one in.

