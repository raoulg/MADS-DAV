name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Check ParseIRCLines hasn't drifted (lesson 1 vs scripts/pipelines.py)
        run: uv run python tools/check_pipeline_drift.py

      # `load_own_chat()` raises when there is no export — a your-turn notebook without
      # data has nothing to test. CI is a testing environment, so it gets data: a
      # synthetic chat with the preprocessor's schema and enough structure for every
      # lesson's technique to find something.
      - name: Build the fixture chat CI runs the your-turn notebooks on
        run: uv run python tools/make_ci_own_chat.py

      - name: Run every notebook top-to-bottom
        run: uv run notebooktester -f -t 900 notebooks/
