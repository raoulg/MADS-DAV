<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRC Network Dashboard</title>
<meta name="description" content="Who talks to whom in #ubuntu-uk, 2015: a force-directed graph and an adjacency matrix of the same edges, under the named rule or the nearby rule.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #f4f1ec;
  --paper-deep: #ebe6de;
  --ink: #111111;
  --petrol: #1d5a73;
  --petrol-light: #5e93a8;
  --vermilion: #c43a14;
  --grey: #5a544d;
  --grey-light: #cfc7bb;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Outfit", system-ui, sans-serif;
  font-size: 18px;
  line-height: 1.35;
  overflow-x: hidden;
}
main { padding: 20px 32px 16px; max-width: 1920px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; }
h1 { font-size: 30px; font-weight: 600; margin: 0; }
.channel { font-family: "JetBrains Mono", monospace; font-size: 18px; color: var(--grey); }

.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;
  margin: 14px 0 10px; padding: 10px 0; border-top: 1px solid var(--grey-light); border-bottom: 1px solid var(--grey-light);
}
.control { display: flex; align-items: center; gap: 12px; }
.control > .name { font-weight: 500; }
.control .value { font-family: "JetBrains Mono", monospace; font-size: 18px; min-width: 5.5ch; }
.control.disabled { opacity: 0.35; }

.switch { display: inline-flex; border: 1.5px solid var(--petrol); border-radius: 4px; overflow: hidden; }
.switch button {
  font: inherit; font-size: 18px; padding: 5px 16px; border: 0; background: transparent; color: var(--petrol); cursor: pointer;
}
.switch button + button { border-left: 1.5px solid var(--petrol); }
.switch button[aria-pressed="true"] { background: var(--petrol); color: var(--paper); }

input[type=range] { width: 260px; max-width: 60vw; accent-color: var(--petrol); }
.ticks { display: flex; justify-content: space-between; width: 260px; max-width: 60vw;
  font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--grey); padding: 0 4px; }
.slider-stack { display: flex; flex-direction: column; }

.caption {
  font-family: "JetBrains Mono", monospace; font-size: 20px; margin: 0 0 10px;
}
.caption b { font-weight: 600; color: var(--petrol); }

.views { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.view { min-width: 0; display: flex; flex-direction: column; align-items: center; }
.view h2 { align-self: stretch; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px;
  font-size: 19px; font-weight: 500; margin: 0 0 6px; color: var(--grey); }
.view svg.main {
  display: block; width: min(100%, calc(100vh - 250px)); min-width: 280px; max-width: 100%; aspect-ratio: 1 / 1; height: auto;
}
.legend { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--grey); display: inline-flex; align-items: center; gap: 8px; }

.tip {
  position: fixed; pointer-events: none; display: none; z-index: 10;
  background: var(--paper); border: 1.5px solid var(--vermilion); padding: 8px 12px;
  font-family: "JetBrains Mono", monospace; font-size: 17px; line-height: 1.4;
}
.tip .who { font-family: "Outfit", sans-serif; font-weight: 600; font-size: 21px; color: var(--vermilion); }

svg text { font-family: "JetBrains Mono", monospace; fill: var(--grey); }

@media (max-width: 1100px) {
  .views { grid-template-columns: 1fr; }
  .view svg.main { width: min(100%, 760px); }
}
@media (max-width: 600px) {
  main { padding: 14px 16px; }
  h1 { font-size: 24px; }
  .caption { font-size: 16px; }
  .controls { gap: 12px 20px; }
  .control { flex-wrap: wrap; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Who talks to whom</h1>
    <span class="channel" id="channel"></span>
  </header>

  <div class="controls">
    <div class="control">
      <span class="name">Rule</span>
      <div class="switch" role="group" aria-label="Edge rule">
        <button type="button" data-rule="named">named</button>
        <button type="button" data-rule="nearby">nearby</button>
      </div>
    </div>
    <div class="control" id="window-control">
      <label class="name" for="window">Window</label>
      <div class="slider-stack">
        <input type="range" id="window" min="0" max="3" step="1">
        <div class="ticks"><span>60</span><span>300</span><span>600</span><span>1800</span></div>
      </div>
      <span class="value" id="window-value"></span>
    </div>
    <div class="control">
      <label class="name" for="minw">Minimum weight</label>
      <div class="slider-stack">
        <input type="range" id="minw" min="0" step="0.01">
        <div class="ticks" id="minw-ticks"></div>
      </div>
      <span class="value" id="minw-value"></span>
    </div>
  </div>

  <p class="caption" id="caption" aria-live="polite"></p>

  <div class="views">
    <section class="view">
      <h2><span>Force-directed graph</span><span class="legend">node size = messages</span></h2>
      <svg class="main" id="graph" viewBox="0 0 800 800" role="img" aria-label="Force-directed graph of the people and their edges"></svg>
    </section>
    <section class="view">
      <h2><span>Adjacency matrix, ordered by message count</span><span class="legend" id="legend"></span></h2>
      <svg class="main" id="matrix" viewBox="0 0 800 800" role="img" aria-label="Adjacency matrix of the same edges"></svg>
    </section>
  </div>
</main>
<div class="tip" id="tip"></div>

"davmor2",1077],["diplo","bashrc",282],["diplo","zmoylan-pi",1934],["diplo","Laney",259],["diplo","bashrc_",323],["diplo","foobarry",3938],["diplo","directhex",396],["diplo","Azelphur",369],["diplo","Seeker`",8],["diplo","elfy",1],["diplo","Sebsebsebb",11],["diplo","selinuxium",68],["mappps","zmoylan-pi",1272],["mappps","foobarry",626],["mappps","davmor2",45],["mappps","awilkins_",25],["mappps","bashrc",30],["mappps","directhex",12],["mappps","elfy",54],["mappps","Seeker`",9],["mappps","Laney",4],["mappps","Nokaji",4],["Azelphur","zmoylan-pi",1170],["Azelphur","Laney",27],["Azelphur","davmor2",669],["Azelphur","sebsebseb",238],["Azelphur","bashrc_",40],["Azelphur","bashrc",32],["Azelphur","directhex",482],["Azelphur","Seeker`",47],["Azelphur","foobarry",1033],["Azelphur","awilkins_",21],["Azelphur","Sebsebsebb",82],["Azelphur","elfy",53],["CupofPSB","davmor2",10],["CupofPSB","directhex",7],["CupofPSB","bashrc_",51],["CupofPSB","foobarry",495],["Nokaji","directhex",172],["Nokaji","foobarry",20],["Nokaji","zmoylan-pi",91],["Nokaji","sebsebseb",1],["Laney","zmoylan-pi",832],["Laney","directhex",253],["Laney","davmor2",709],["Laney","bashrc",65],["Laney","sebsebseb",13],["Laney","selinuxium",9],["Laney","bashrc_",95],["Laney","foobarry",758],["Laney","Seeker`",1],["Laney","elfy",33],["Laney","awilkins_",63],["Laney","neuro",9],["zmoylan-pi","foobarry",7148],["zmoylan-pi","davmor2",3906],["zmoylan-pi","bashrc_",848],["zmoylan-pi","bashrc",584],["zmoylan-pi","directhex",1582],["zmoylan-pi","sebsebseb",342],["zmoylan-pi","awilkins_",315],["zmoylan-pi","Seeker`",131],["zmoylan-pi","Sebsebsebb",378],["zmoylan-pi","elfy",172],["zmoylan-pi","safiyyah",189],["zmoylan-pi","selinuxium",57],["zmoylan-pi","neuro",1278],["zmoylan-pi","Supermanintights",19],["neuro","davmor2",13],["neuro","directhex",59],["neuro","foobarry",2],["elfy","bashrc",11],["elfy","davmor2",25],["elfy","directhex",9],["elfy","foobarry",36],["bashrc_","davmor2",367],["bashrc_","foobarry",908],["bashrc_","direc <script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const WINDOWS = ["60", "300", "600", "1800"];
const C = {
  ink: "#111111", petrol: "#1d5a73", petrolLight: "#5e93a8", vermilion: "#c43a14",
  grey: "#5a544d", greyLight: "#cfc7bb", paperDeep: "#ebe6de",
};

const nodes = DATA.nodes.map(d => ({ id: d.id, messages: d.messages }))
  .sort((a, b) => b.messages - a.messages);
nodes.forEach((d, i) => { d.rank = i; });
const byId = new Map(nodes.map(d => [d.id, d]));
const N = nodes.length;

document.getElementById("channel").textContent = `${DATA.channel} · ${N} people`;

// ---------- state (initial values from ?query or #hash) ----------
const state = { rule: "nearby", window: "60", min: 1, person: null };
(function readParams() {
  const p = new URLSearchParams(location.search);
  new URLSearchParams(location.hash.slice(1)).forEach((v, k) => p.set(k, v));
  if (p.get("rule") === "named" || p.get("rule") === "nearby") state.rule = p.get("rule");
  if (WINDOWS.includes(p.get("window"))) state.window = p.get("window");
  const m = Number(p.get("min"));
  if (Number.isFinite(m) && m >= 1) state.min = Math.round(m);
  if (byId.has(p.get("person"))) state.person = p.get("person");
})();

function writeParams() {
  const p = new URLSearchParams({ rule: state.rule, window: state.window, min: state.min });
  try { history.replaceState(null, "", "#" + p.toString()); } catch (e) { /* file:// may refuse; the state still works */ }
}

const allEdges = () => (state.rule === "named" ? DATA.named : DATA.windows[state.window]);
const maxWeight = () => d3.max(allEdges(), e => e[2]);

// ---------- controls ----------
const ruleButtons = document.querySelectorAll(".switch button");
const windowInput = document.getElementById("window");
const minInput = document.getElementById("minw");

ruleButtons.forEach(b => b.addEventListener("click", () => {
  state.rule = b.dataset.rule; update();
}));
windowInput.addEventListener("input", () => { state.window = WINDOWS[+windowInput.value]; update(); });
minInput.addEventListener("input", () => { state.min = Math.max(1, Math.round(10 ** +minInput.value)); update(); });

function syncControls() {
  ruleButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.rule === state.rule)));
  const nearby = state.rule === "nearby";
  windowInput.disabled = !nearby;
  document.getElementById("window-control").classList.toggle("disabled", !nearby);
  windowInput.value = WINDOWS.indexOf(state.window);
  document.getElementById("window-value").textContent = nearby ? `${state.window} s` : "n/a";

  const top = Math.log10(maxWeight());
  minInput.max = top.toFixed(2);
  if (state.min > maxWeight()) state.min = maxWeight();
  minInput.value = Math.log10(state.min);
  document.getElementById("minw-value").textContent = `≥ ${state.min}`;
  const ticks = [1, 10, 100, 1000, 10000].filter(t => t <= maxWeight());
  document.getElementById("minw-ticks").innerHTML = ticks.map(t => `<span>${t}</span>`).join("");
}

// ---------- force-directed graph ----------
const S = 800;
const gsvg = d3.select("#graph");
const gEdges = gsvg.append("g");
const gNodes = gsvg.append("g");
const gLabels = gsvg.append("g");
const radius = d3.scaleSqrt().domain([0, nodes[0].messages]).range([3, 24]);

const sim = d3.forceSimulation(nodes)
  .force("charge", d3.forceManyBody().strength(-260))
  .force("link", d3.forceLink().id(d => d.id).distance(110).strength(0.04))
  .force("x", d3.forceX(S / 2).strength(0.05))
  .force("y", d3.forceY(S / 2).strength(0.05))
  .force("collide", d3.forceCollide(d => radius(d.messages) + 2))
  .velocityDecay(0.55)
  .stop();

let links = [];
let lineSel = gEdges.selectAll("line");
const nodeSel = gNodes.selectAll("circle").data(nodes, d => d.id).join("circle")
  .attr("r", d => radius(d.messages))
  .attr("stroke", "#f4f1ec").attr("stroke-width", 1.2)
  .style("cursor", "pointer")
  .on("mouseenter", (ev, d) => { setPerson(d.id); placeTip(ev.clientX, ev.clientY); })
  .on("mousemove", ev => placeTip(ev.clientX, ev.clientY))
  .on("mouseleave", () => setPerson(null));
const labelSel = gLabels.selectAll("text").data(nodes, d => d.id).join("text")
  .attr("font-size", 15).attr("text-anchor", "middle").attr("pointer-events", "none")
  .attr("paint-order", "stroke").attr("stroke", "#f4f1ec").attr("stroke-width", 4)
  .text(d => d.id);

function clamp(d) {
  const r = radius(d.messages) + 2;
  d.x = Math.max(r, Math.min(S - r, d.x));
  d.y = Math.max(r, Math.min(S - r, d.y));
}
function drawGraph() {
  nodes.forEach(clamp);
  lineSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("cx", d => d.x).attr("cy", d => d.y);
  labelSel.attr("x", d => d.x).attr("y", d => d.y - radius(d.messages) - 6);
}
sim.on("tick", drawGraph);

// ---------- adjacency matrix ----------
const M = { left: 62, top: 62, size: 720 };
const cell = M.size / N;
const msvg = d3.select("#matrix");
msvg.append("rect").attr("x", M.left).attr("y", M.top).attr("width", M.size).attr("height", M.size)
  .attr("fill", C.paperDeep).attr("stroke", C.greyLight);
const gCells = msvg.append("g");
const gHi = msvg.append("g").attr("pointer-events", "none");
const ticks = [1, 10, 20, 30, 40, 50, 60, 70, 80];
msvg.append("g").selectAll("text").data(ticks).join("text")
  .attr("x", d => M.left + (d - 0.5) * cell).attr("y", M.top - 8)
  .attr("text-anchor", "middle").attr("font-size", 14).text(d => d);
msvg.append("g").selectAll("text").data(ticks).join("text")
  .attr("x", M.left - 8).attr("y", d => M.top + (d - 0.5) * cell).attr("dy", "0.35em")
  .attr("text-anchor", "end").attr("font-size", 14).text(d => d);
msvg.append("text").attr("x", M.left).attr("y", M.top - 34).attr("font-size", 15)
  .text("rank by messages: 1 = most active →");
msvg.append("rect").attr("x", M.left).attr("y", M.top).attr("width", M.size).attr("height", M.size)
  .attr("fill", "transparent")
  .on("mousemove", (ev) => {
    const [x, y] = d3.pointer(ev);
    const i = Math.floor((y - M.top) / cell), j = Math.floor((x - M.left) / cell);
    if (i < 0 || i >= N || j < 0 || j >= N) return;
    setPerson(nodes[i].id, nodes[j].id);
    placeTip(ev.clientX, ev.clientY);
  })
  .on("mouseleave", () => setPerson(null));

const colorStops = ["#d3e2e8", C.petrolLight, C.petrol, "#0a2430"];
let color = d3.scaleSequentialLog(d3.interpolateRgbBasis(colorStops)).domain([1, 10]);
let weightOf = new Map();

function drawLegend() {
  const max = maxWeight();
  const w = 140, h = 12;
  const id = "lg";
  document.getElementById("legend").innerHTML =
    `<span>1</span><svg width="${w}" height="${h}" aria-hidden="true"><defs><linearGradient id="${id}">` +
    colorStops.map((c, k) => `<stop offset="${k / (colorStops.length - 1)}" stop-color="${c}"/>`).join("") +
    `</linearGradient></defs><rect width="${w}" height="${h}" fill="url(#${id})"/></svg><span>${max} (log)</span>`;
}

// ---------- update: filter once, feed both views ----------
let neighbours = new Map();

function update() {
  syncControls();
  writeParams();
  const edges = allEdges().filter(e => e[2] >= state.min);

  neighbours = new Map(nodes.map(d => [d.id, new Set()]));
  weightOf = new Map();
  for (const [u, v, w] of edges) {
    neighbours.get(u).add(v); neighbours.get(v).add(u);
    weightOf.set(u + "\u0000" + v, w); weightOf.set(v + "\u0000" + u, w);
  }

  // graph
  const maxW = maxWeight();
  const width = d3.scaleLog().domain([1, Math.max(2, maxW)]).range([0.7, 5]);
  links = edges.map(([u, v, w]) => ({ source: u, target: v, weight: w }));
  lineSel = gEdges.selectAll("line").data(links, d => {
    const a = typeof d.source === "object" ? d.source.id : d.source;
    const b = typeof d.target === "object" ? d.target.id : d.target;
    return a + "|" + b;
  }).join("line").attr("stroke-width", d => width(d.weight));
  sim.force("link").links(links);

  // matrix
  color = d3.scaleSequentialLog(d3.interpolateRgbBasis(colorStops)).domain([1, Math.max(2, maxW)]);
  const cells = [];
  for (const [u, v, w] of edges) {
    cells.push({ i: byId.get(u).rank, j: byId.get(v).rank, w });
    cells.push({ i: byId.get(v).rank, j: byId.get(u).rank, w });
  }
  gCells.selectAll("rect").data(cells, d => d.i + "," + d.j).join("rect")
    .attr("x", d => M.left + d.j * cell).attr("y", d => M.top + d.i * cell)
    .attr("width", cell).attr("height", cell)
    .attr("fill", d => color(d.w));
  drawLegend();

  document.getElementById("caption").innerHTML = captionText(edges.length, allEdges().length);
  highlight();
  return edges.length;
}

function captionText(n, total) {
  const rule = state.rule === "named"
    ? "rule <b>named</b> (addressed each other by name)"
    : "rule <b>nearby</b> (spoke close together in time)";
  const win = state.rule === "named" ? "window <b>n/a</b> (the named rule has none)" : `window <b>${state.window} s</b>`;
  return `${rule} · ${win} · min weight <b>${state.min}</b> · <b>${n}</b> of ${total} edges left`;
}

// ---------- hover: one person, both views ----------
const tip = document.getElementById("tip");

function setPerson(id, other) {
  state.person = id;
  state.other = other || null;
  highlight();
}

function highlight() {
  const p = state.person;
  if (!p) {
    nodeSel.attr("fill", C.petrol).attr("opacity", 1);
    lineSel.attr("stroke", C.petrolLight).attr("stroke-opacity", 0.35);
    labelSel.attr("display", "none");
    gCells.selectAll("rect").attr("opacity", 1);
    gHi.selectAll("*").remove();
    tip.style.display = "none";
    return;
  }
  const nb = neighbours.get(p);
  nodeSel.attr("fill", d => d.id === p ? C.vermilion : C.petrol)
    .attr("opacity", d => d.id === p || nb.has(d.id) ? 1 : 0.2);
  lineSel.attr("stroke", d => (d.source.id === p || d.target.id === p) ? C.vermilion : C.petrolLight)
    .attr("stroke-opacity", d => (d.source.id === p || d.target.id === p) ? 0.85 : 0.05);
  labelSel.attr("display", d => d.id === p ? null : "none").attr("fill", C.vermilion).attr("font-weight", 600);
  nodeSel.filter(d => d.id === p).raise();

  const r = byId.get(p).rank;
  gCells.selectAll("rect").attr("opacity", d => d.i === r || d.j === r ? 1 : 0.25);
  gHi.selectAll("*").remove();
  gHi.append("rect").attr("x", M.left).attr("y", M.top + r * cell).attr("width", M.size).attr("height", cell)
    .attr("fill", "none").attr("stroke", C.vermilion).attr("stroke-width", 2);
  gHi.append("rect").attr("x", M.left + r * cell).attr("y", M.top).attr("width", cell).attr("height", M.size)
    .attr("fill", "none").attr("stroke", C.vermilion).attr("stroke-width", 2);
  gHi.append("text").attr("x", M.left + M.size).attr("y", M.top - 34).attr("text-anchor", "end")
    .attr("font-size", 16).attr("font-weight", 600).style("fill", C.vermilion)
    .text(`#${r + 1} ${p}`);

  const d = byId.get(p);
  let html = `<div class="who">${p}</div>degree ${nb.size}<br>${d.messages.toLocaleString("en-US")} messages · rank ${d.rank + 1}`;
  if (state.other && state.other !== p) {
    const w = weightOf.get(p + "\u0000" + state.other);
    html += `<br>with ${state.other}: ${w ? "weight " + w : "no edge"}`;
  }
  tip.innerHTML = html;
  tip.style.display = "block";
}

function placeTip(x, y) {
  const pad = 18, w = tip.offsetWidth, h = tip.offsetHeight;
  const left = x + pad + w > window.innerWidth ? x - pad - w : x + pad;
  const top = y + pad + h > window.innerHeight ? y - pad - h : y + pad;
  tip.style.left = Math.max(4, left) + "px";
  tip.style.top = Math.max(4, top) + "px";
}

// ---------- start: settle the layout once, then keep positions ----------
update();
sim.alpha(1);
for (let k = 0; k < 400; k++) sim.tick();
drawGraph();

// Every later change keeps the positions and only reheats the layout gently,
// so the picture shifts a little instead of being laid out anew.
const reheat = () => sim.alpha(Math.max(sim.alpha(), 0.1)).restart();
ruleButtons.forEach(b => b.addEventListener("click", reheat));
windowInput.addEventListener("input", reheat);
minInput.addEventListener("input", reheat);

if (state.person) {
  const pinned = state.person;
  setPerson(pinned);
  const n = byId.get(pinned);
  const pt = gsvg.node().createSVGPoint(); pt.x = n.x; pt.y = n.y;
  const sp = pt.matrixTransform(gsvg.node().getScreenCTM());
  placeTip(sp.x, sp.y);
}
</script>
</body>
</html>
