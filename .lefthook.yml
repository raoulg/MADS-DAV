pre-commit:
  commands:
    format:
      files: git ls-files
      glob: '*.{py, ipynb}'
      run: uv run ruff format {staged_files}
      stage_fixed: true
    clean-jupyter:
      files: git ls-files
      glob: '*.ipynb'
      run: uv run jupyter nbconvert --clear-output --inplace {staged_files}
      stage_fixed: true
    check:
      files: git ls-files
      glob: '*.{py, ipynb}'
      run: uv run ruff check {staged_files} --fix
    ty:
      glob: '*.py'
      run: uv run ty check {staged_files}
    lychee:
      run: uv run lychee . --suggest --max-concurrency 32 --cache --format detailed --max-cache-age 7d
    notebooktester:
      glob: '*.ipynb'
      run: uv run notebooktester notebooks -v -t 150
    pipeline-drift:
      glob: '{scripts/pipelines.py,notebooks/lesson1/01-cleaning.ipynb}'
      run: uv run python tools/check_pipeline_drift.py
